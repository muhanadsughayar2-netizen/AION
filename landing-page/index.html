    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0e1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; }

      .welcome-logo { margin-bottom: 16px; }

      .welcome-highlight { color: #00d9ff; }
      .welcome-tagline { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.6); margin-bottom: 8px; letter-spacing: 0.5px; }
      .welcome-sub { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 40px; line-height: 1.5; }
      .pin-guide { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 28px 24px; margin-bottom: 32px; }
      .pin-title { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 20px; letter-spacing: 0.3px; }
      .pin-animation { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
      .pin-step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .pin-browser-bar, .pin-dropdown, .pin-done { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .pin-puzzle-icon { position: relative; width: 40px; height: 40px; background: rgba(0,217,255,0.08); border: 1px solid rgba(0,217,255,0.25); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
      .pin-click-ring { position: absolute; inset: -4px; border: 2px solid rgba(0,217,255,0.4); border-radius: 14px; animation: pinPulse 2.5s ease-in-out infinite; }
      .ring-2 { animation-delay: 0.5s !important; }
      .pin-label { font-size: 11px; color: rgba(255,255,255,0.4); }
      .pin-ext-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; }
      .pin-ext-icon { font-size: 16px; }
      .pin-ext-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); }
      .pin-pin-icon { position: relative; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: rgba(0,217,255,0.7); cursor: pointer; }
      .pin-arrow { font-size: 20px; color: rgba(0,217,255,0.3); font-weight: 300; }
      .pin-done { animation: pinDoneAppear 2.5s ease-in-out infinite; }
      .pin-done-icon { width: 36px; height: 36px; background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #00ff88; font-size: 16px; font-weight: 700; }
      .pin-done-text { font-size: 12px; font-weight: 600; color: #00ff88; }
      .welcome-cta { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #00d9ff, #00b8d4); border-radius: 12px; color: #000; font-size: 15px; font-weight: 700; text-decoration: none; transition: all 0.2s; }
      .welcome-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,217,255,0.3); }
      .welcome-footer { position: absolute; bottom: 24px; z-index: 1; }
      .welcome-privacy { font-size: 11px; color: rgba(255,255,255,0.25); cursor: default; }
      @keyframes pinPulse { 0%, 100% { opacity: 0; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes pinDoneAppear { 0%, 40% { opacity: 0.3; } 60%, 90% { opacity: 1; } }
      @media (max-width: 480px) {
        .welcome-title { font-size: 32px; }
        .pin-animation { flex-direction: column; gap: 12px; }
        .pin-arrow { transform: rotate(90deg); }

        </div>

    <div id="adminModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center;">
        <div style="background:rgba(15,23,42,0.95); border:1px solid rgba(6,182,212,0.3); border-radius:16px; padding:40px; max-width:400px; width:90%; text-align:center; backdrop-filter:blur(20px);">
            <h2 style="color:#06b6d4; margin:0 0 20px 0; font-size:1.5rem;">Admin Access</h2>
            <input type="password" id="adminPass" placeholder="Enter password" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(6,182,212,0.3); border-radius:8px; color:#fff; font-size:1rem; margin-bottom:16px; box-sizing:border-box; outline:none;">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button onclick="attemptLogin()" style="padding:10px 24px; background:linear-gradient(135deg,#06b6d4,#0891b2); border:none; border-radius:8px; color:#fff; font-weight:600; cursor:pointer;">Login</button>
                <button onclick="document.getElementById('adminModal').style.display='none'" style="padding:10px 24px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; cursor:pointer;">Cancel</button>
            </div>
            <p id="adminError" style="color:#ff4757; margin:12px 0 0 0; font-size:0.85rem; display:none;"></p>
        </div>
    </div>
    <script>
    (function(){
        var c=0,t=null;
        document.getElementById('footerText').addEventListener('click',function(){
            c++;clearTimeout(t);
            t=setTimeout(function(){c=0},2000);
            if(c>=5){c=0;document.getElementById('adminModal').style.display='flex';document.getElementById('adminPass').focus();}
        });
        document.getElementById('adminPass').addEventListener('keydown',function(e){if(e.key==='Enter')attemptLogin();});
    })();
    function attemptLogin(){
        var p=document.getElementById('adminPass').value;
        fetch('/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})})
        .then(function(r){return r.json()})
        .then(function(d){
            if(d.success){window.location.href=d.redirect;}
            else{var e=document.getElementById('adminError');e.textContent=d.error||'Wrong password';e.style.display='block';}
        })
        .catch(function(){var e=document.getElementById('adminError');e.textContent='Connection error';e.style.display='block';});
    }
    </script>
