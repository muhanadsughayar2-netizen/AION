<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate Screenshot - Flow</title>
  <link rel="stylesheet" href="annotate.css">
</head>
<body>
  <div class="annotate-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-section">
        <div class="section-label">Drawing Tools</div>
        <button class="tool-btn active" data-tool="highlight" title="Smart Highlight - Draw glowing strokes to spotlight areas">
          ✨
        </button>
        <button class="tool-btn" data-tool="spotlight" title="Spotlight Mode - Brighten one area, dim everything else">
          🎯
        </button>
        <button class="tool-btn" data-tool="redact" title="Redact - Pixelate sensitive information">
          🔒
        </button>
        <button class="tool-btn" data-tool="callout" title="Numbered Callouts - Add step-by-step markers">
          🔢
        </button>
        <button class="tool-btn" data-tool="text" title="Add Text">
          ✏️
        </button>
      </div>
      
      <div class="toolbar-section">
        <div class="section-label">Quick Labels</div>
        <button class="sticker-btn" data-text="🐛 BUG" title="Mark as bug">BUG</button>
        <button class="sticker-btn" data-text="⚠️ IMPORTANT" title="Mark as important">IMPORTANT</button>
        <button class="sticker-btn" data-text="👉 FOCUS HERE" title="Focus attention">FOCUS</button>
        <button class="sticker-btn" data-text="✅ GOOD" title="Mark as good">GOOD</button>
        <button class="sticker-btn" data-text="❌ WRONG" title="Mark as wrong">WRONG</button>
      </div>
      
      <div class="toolbar-section">
        <input type="color" id="colorPicker" value="#00d9ff" title="Color">
        <button id="undoBtn" class="tool-btn" title="Undo">↩️</button>
        <button id="clearBtn" class="tool-btn" title="Clear All">🗑️</button>
      </div>
      
      <div class="toolbar-section">
        <button id="saveBtn" class="save-btn">💾 Save</button>
        <button id="cancelBtn" class="cancel-btn">✖ Cancel</button>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
      <input type="text" id="textInput" class="text-input" style="display: none;" placeholder="Type text...">
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status">Select a tool and draw on the screenshot</span>
    </div>
  </div>

  <script src="annotate.js"></script>
</body>
</html>
