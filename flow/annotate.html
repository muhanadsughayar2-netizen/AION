<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate Screenshot - Flow</title>
  <link rel="stylesheet" href="annotate.css">
</head>
<body>
  <div class="annotate-container">
    <!-- Top Bar: Zoom + Browser Frame -->
    <div class="top-bar">
      <!-- Zoom Controls -->
      <div class="zoom-controls">
        <button id="zoomOut" class="zoom-btn" title="Zoom Out">−</button>
        <span id="zoomLevel" class="zoom-level">100%</span>
        <button id="zoomIn" class="zoom-btn" title="Zoom In">+</button>
        <button id="zoomReset" class="zoom-btn zoom-reset" title="Reset Zoom">⟳</button>
      </div>
      
      <!-- Browser Frame Toggle -->
      <div class="browser-frame-controls">
        <button id="toggleBrowserFrame" class="frame-btn" title="Add browser frame">🖥️ Browser Frame</button>
        <select id="frameStyle" class="frame-style-select" style="display: none;">
          <option value="mac" selected>macOS Style</option>
          <option value="windows">Windows Style</option>
          <option value="minimal">Minimal</option>
        </select>
        <select id="frameUrlPosition" class="frame-style-select" style="display: none;">
          <option value="top" selected>URL on Top</option>
          <option value="bottom">URL on Bottom</option>
        </select>
        <input type="text" id="urlInput" class="url-input" readonly placeholder="Auto-detected URL" style="display: none; background: #2a2a2e; font-family: 'SF Mono', Menlo, monospace; font-size: 11px; color: #aaa; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; text-align: center; cursor: default;">
      </div>
      
      <!-- Border Controls - Fixed blue color, thin rounded by default -->
      <div class="border-controls">
        <button id="toggleBorder" class="frame-btn" title="Add border">🔲 Border</button>
        <input type="color" id="borderColor" value="#007AFF" title="Border color" style="display: none !important;">
        <select id="borderWidth" class="border-width-select" style="display: none;">
          <option value="2" selected>Thin (2px)</option>
          <option value="4">Medium (4px)</option>
          <option value="8">Thick (8px)</option>
          <option value="16">Extra Thick (16px)</option>
        </select>
        <select id="borderRadius" class="border-radius-select" style="display: none;">
          <option value="0">Square</option>
          <option value="8" selected>Rounded</option>
          <option value="16">More Rounded</option>
        </select>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-section" id="toolSection">
        <button class="tool-btn" data-tool="crop" title="Crop/Snip area">✂️</button>
        <button class="tool-btn active" data-tool="callout" title="Add numbers">🔢</button>
        <button class="tool-btn" data-tool="special" id="specialBtn" title="Special emojis">🎯</button>
        <!-- Emoji Slide-out Panel -->
        <div id="emojiPanel" class="emoji-panel" style="display: none;">
          <div class="emoji-grid">
            <button class="emoji-item" data-emoji="🚀">🚀</button>
            <button class="emoji-item" data-emoji="🔥">🔥</button>
            <button class="emoji-item" data-emoji="👀">👀</button>
            <button class="emoji-item" data-emoji="🧠">🧠</button>
            <button class="emoji-item" data-emoji="📈">📈</button>
            <button class="emoji-item" data-emoji="💰">💰</button>
            <button class="emoji-item" data-emoji="✅">✅</button>
            <button class="emoji-item" data-emoji="❌">❌</button>
            <button class="emoji-item" data-emoji="⚠️">⚠️</button>
            <button class="emoji-item" data-emoji="❓">❓</button>
            <button class="emoji-item" data-emoji="💡">💡</button>
            <button class="emoji-item" data-emoji="⭐">⭐</button>
            <button class="emoji-item" data-emoji="❤️">❤️</button>
            <button class="emoji-item" data-emoji="👍">👍</button>
            <button class="emoji-item" data-emoji="👎">👎</button>
            <button class="emoji-item" data-emoji="🎯">🎯</button>
            <button class="emoji-item" data-emoji="💎">💎</button>
            <button class="emoji-item" data-emoji="🏆">🏆</button>
            <button class="emoji-item" data-emoji="⚡">⚡</button>
            <button class="emoji-item" data-emoji="🔑">🔑</button>
          </div>
        </div>
        <button class="tool-btn" data-tool="rectangle" title="Draw rectangle">▢</button>
        <button class="tool-btn" data-tool="arrow" title="Draw arrow">➤</button>
      </div>
      
      <div class="toolbar-section">
        <div id="customStickers"></div>
        <button id="createStickerBtn" class="create-sticker-btn" title="Add sticky note">📝 Sticky Note</button>
      </div>
      
      <div class="toolbar-section">
        <input type="color" id="colorPicker" value="#007AFF" title="Color">
        <div class="size-control">
          <input type="range" id="brushSize" min="4" max="40" value="12">
          <span id="sizeValue">12px</span>
        </div>
      </div>
      
      <div class="toolbar-section">
        <button id="undoBtn" class="tool-btn history-btn" title="Undo">↩</button>
        <button id="redoBtn" class="tool-btn history-btn" title="Redo">↪</button>
        <button id="clearBtn" class="tool-btn" title="Clear all">🗑️</button>
        <button id="saveBtn" class="save-btn">💾 Save</button>
        <button id="cancelBtn" class="cancel-btn">× Close</button>
      </div>
    </div>

    <!-- Page Navigation (for Full Page mode) -->
    <div id="pageNav" class="page-nav" style="display: none;">
      <button id="prevPage" class="nav-btn" title="Previous page">◀</button>
      <span id="pageIndicator" class="page-indicator">Page 1 / 1</span>
      <button id="nextPage" class="nav-btn" title="Next page">▶</button>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-container">
      <div id="canvasWrapper" class="canvas-wrapper">
        <!-- Browser Frame Overlay - Floats above canvas, never overlaps content -->
        <div id="browserFrameOverlay" class="browser-frame-overlay" style="display: none;">
          <div class="frame-traffic-lights">
            <div class="traffic-light red"></div>
            <div class="traffic-light yellow"></div>
            <div class="traffic-light green"></div>
          </div>
          <div class="frame-url-bar">
            <span class="frame-url-text" id="frameUrlText">🔒 example.com</span>
          </div>
          <div class="frame-windows-controls" style="display: none;">
            <div class="win-btn">─</div>
            <div class="win-btn">☐</div>
            <div class="win-btn close">✕</div>
          </div>
        </div>
        <canvas id="canvas"></canvas>
      </div>
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status">Add numbers, shapes, or text. All draggable!</span>
    </div>
  </div>

  <script src="annotate.js"></script>
</body>
</html>
