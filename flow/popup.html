<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* RTL support for Arabic */
    html[dir="rtl"] .container {
      direction: rtl;
    }
    html[dir="rtl"] .selection-bar {
      direction: rtl;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">FLOW</div>
      <div class="counter">
        <span id="snapCount">0</span> / <span>9</span>
      </div>
    </div>

    <!-- Status Line -->
    <div class="status" id="status" data-i18n="flowReady">Flow: Ready</div>

    <!-- Main Orb Button -->
    <div class="orb-container">
      <button id="orbButton" class="orb" title="Capture screenshot or upload to AI">
        <div class="orb-glow"></div>
        <div class="orb-inner">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </button>
    </div>

    <!-- Selection Controls -->
    <div class="selection-bar" id="selectionBar" style="display: none;">
      <button id="selectAllBtn" class="select-all-btn">Select All</button>
      <button id="copySelectedBtn" class="action-btn">Copy Selected</button>
      <button id="downloadSelectedBtn" class="action-btn">Download Selected</button>
      <button id="exportPdfBtn" class="action-btn premium">📄 Export PDF</button>
    </div>

    <!-- Thumbnails Grid -->
    <div class="thumbnails-container">
      <div id="thumbnails" class="thumbnails"></div>
    </div>

    <!-- Clear All Button -->
    <button id="clearButton" class="clear-button">Clear All</button>
  </div>

  <!-- Full-Size Preview Modal -->
  <div id="previewModal" class="preview-modal" style="display: none;">
    <div class="preview-close" id="previewClose">✕</div>
    <img id="previewImage" class="preview-image" alt="Preview">
    <div class="preview-number" id="previewNumber"></div>
  </div>

  <!-- PDF Export Options Modal -->
  <div id="pdfExportModal" class="pdf-export-modal" style="display: none;">
    <div class="pdf-modal-content">
      <div class="pdf-modal-header">
        <h3>📄 Export PDF Options</h3>
        <div class="pdf-modal-close" id="pdfModalClose">✕</div>
      </div>
      
      <div class="pdf-options">
        <button class="pdf-option-btn" data-mode="all-combined">
          <div class="pdf-option-icon">📚</div>
          <div class="pdf-option-text">
            <strong>All as One PDF</strong>
            <span>Combine all screenshots into one PDF file</span>
          </div>
        </button>
        
        <button class="pdf-option-btn" data-mode="all-separate">
          <div class="pdf-option-icon">📑</div>
          <div class="pdf-option-text">
            <strong>All as Separate PDFs</strong>
            <span>Download each screenshot as individual PDF</span>
          </div>
        </button>
        
        <button class="pdf-option-btn" data-mode="selected-combined" id="selectedCombinedBtn">
          <div class="pdf-option-icon">✅</div>
          <div class="pdf-option-text">
            <strong>Selected as One PDF</strong>
            <span>Combine selected screenshots into one PDF</span>
          </div>
        </button>
        
        <button class="pdf-option-btn" data-mode="selected-separate" id="selectedSeparateBtn">
          <div class="pdf-option-icon">📋</div>
          <div class="pdf-option-text">
            <strong>Selected as Separate PDFs</strong>
            <span>Download each selected screenshot as PDF</span>
          </div>
        </button>
      </div>
      
      <button class="pdf-cancel-btn" id="pdfCancelBtn">Cancel</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
