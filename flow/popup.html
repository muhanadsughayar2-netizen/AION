<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* RTL support for Arabic */
    html[dir="rtl"] .container {
      direction: rtl;
    }
    html[dir="rtl"] .selection-bar {
      direction: rtl;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo"><span class="logo-word">Snap</span> <span class="logo-word">To</span> <span class="logo-word">AI</span></div>
      <div class="counter">
        <span id="snapCount">0</span> / <span>9</span>
      </div>
    </div>

    <!-- Triple Orb Buttons: Snap, Snip & Full Page -->
    <div class="orb-triple-container">
      <div class="orb-wrapper">
        <span class="orb-label">Snap</span>
        <button id="orbButton" class="orb" title="Capture full screenshot">
          <div class="orb-glow"></div>
          <div class="orb-inner">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </button>
      </div>
      <div class="orb-wrapper">
        <span class="orb-label">Snip</span>
        <button id="snipButton" class="orb snip-orb" title="Crop and snip areas">
          <div class="orb-glow"></div>
          <div class="orb-inner">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="6" cy="6" r="3" stroke="currentColor" stroke-width="2"/>
              <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
              <line x1="20" y1="4" x2="8.12" y2="15.88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="14.47" y1="14.48" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="8.12" y1="8.12" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </button>
      </div>
      <div class="orb-wrapper">
        <span class="orb-label">Full Page</span>
        <button id="fullPageButton" class="orb full-page-orb" title="Capture entire page">
          <div class="orb-glow"></div>
          <div class="orb-inner">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
              <line x1="9" y1="9" x2="15" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="9" y1="13" x2="15" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="9" y1="17" x2="15" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </button>
      </div>
    </div>

    <!-- GLOBAL COUNTER - SnapToAI Community (NOW AT TOP) -->
    <div id="globalCounterContainer" style="
      text-align: center;
      margin: 8px 0;
      font-size: 13px;
      color: rgba(0, 255, 255, 0.7);
    ">
      Snap it. Snip it. Ship it to AI. 🔥
      <br>
      <div id="globalCounter" style="margin-top: 6px; min-height: 24px;">
        Loading counter...
      </div>
    </div>
    <!-- END GLOBAL COUNTER -->

    <!-- Status Line with Activity Indicator (NOW BELOW COUNTER, STICKY) -->
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span class="status" id="status" data-i18n="flowReady">SnapToAI: Ready</span>
    </div>

    <!-- Full Page Capture Overlay -->
    <div id="fullPageOverlay" class="fullpage-overlay" style="display: none;">
      <div class="fullpage-progress">
        <div class="fullpage-spinner"></div>
        <div id="fullPageStatus">Capturing full page... 0%</div>
      </div>
    </div>

    <!-- Last Capture Preview - HIDDEN (takes up space unnecessarily) -->
    <div id="lastCapturePreview" class="last-capture-preview" style="display: none !important; height: 0; overflow: hidden;">
      <img id="lastCaptureImage" class="last-capture-image" alt="Last capture">
    </div>

    <!-- Selection Controls -->
    <div class="selection-bar" id="selectionBar" style="display: none;">
      <button id="selectAllBtn" class="select-all-btn">Select All</button>
      <button id="copySelectedBtn" class="action-btn">Copy Selected</button>
      <button id="downloadSelectedBtn" class="action-btn">Download Selected</button>
      <button id="exportPdfBtn" class="action-btn premium">📄 Export PDF</button>
    </div>

    <!-- Thumbnails Grid -->
    <div class="thumbnails-container">
      <div id="thumbnails" class="thumbnails"></div>
    </div>
    
    <!-- RE-EDIT Full Page Button - PERMANENTLY HIDDEN -->
    <!-- <button id="reeditFullPageBtn" class="reedit-fullpage-btn" style="display:none;">
      RE-EDIT: <span id="reeditCaptureName">Full Page</span>
    </button> -->

    <!-- Clear All Button -->
    <button id="clearButton" class="clear-button">Clear All</button>
  </div>

  <!-- Full-Size Preview Modal -->
  <div id="previewModal" class="preview-modal" style="display: none;">
    <div class="preview-close" id="previewClose">✕</div>
    <img id="previewImage" class="preview-image" alt="Preview">
    <div class="preview-number" id="previewNumber"></div>
  </div>

  <!-- PDF Export Options Modal -->
  <div id="pdfExportModal" class="pdf-export-modal" style="display: none;">
    <div class="pdf-modal-content">
      <div class="pdf-modal-header">
        <h3>📄 Export PDF Options</h3>
        <div class="pdf-modal-close" id="pdfModalClose">✕</div>
      </div>
      
      <div class="pdf-options">
        <button class="pdf-option-btn" data-mode="all-combined">
          <div class="pdf-option-icon">📚</div>
          <div class="pdf-option-text">
            <strong>All as One PDF</strong>
            <span>Combine all screenshots into one PDF file</span>
          </div>
        </button>
        
        <button class="pdf-option-btn" data-mode="all-separate">
          <div class="pdf-option-icon">📑</div>
          <div class="pdf-option-text">
            <strong>All as Separate PDFs</strong>
            <span>Download each screenshot as individual PDF</span>
          </div>
        </button>
        
        <button class="pdf-option-btn" data-mode="selected-combined" id="selectedCombinedBtn">
          <div class="pdf-option-icon">✅</div>
          <div class="pdf-option-text">
            <strong>Selected as One PDF</strong>
            <span>Combine selected screenshots into one PDF</span>
          </div>
        </button>
        
        <button class="pdf-option-btn" data-mode="selected-separate" id="selectedSeparateBtn">
          <div class="pdf-option-icon">📋</div>
          <div class="pdf-option-text">
            <strong>Selected as Separate PDFs</strong>
            <span>Download each selected screenshot as PDF</span>
          </div>
        </button>
      </div>
      
      <button class="pdf-cancel-btn" id="pdfCancelBtn">Cancel</button>
    </div>
  </div>

  <!-- Processing Overlay with Timer -->
  <div id="processingOverlay" class="processing-overlay">
    <div class="processing-spinner"></div>
    <div class="processing-text" id="processingText">Processing...</div>
    <div class="processing-timer" id="processingTimer">00:00</div>
    <div class="processing-subtext" id="processingSubtext">Please wait</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
