<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07070a; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  <script>
    window.addEventListener('message', function(event) {
      var data = event.data;
      if (data && data.htmlCode) {
        var frame = document.getElementById('preview');
        frame.srcdoc = data.htmlCode;
      }
    });
    window.parent.postMessage({ sandboxReady: true }, '*');
  </script>
</body>
</html>
