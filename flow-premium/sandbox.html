<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI Sandbox</title>
  <!-- Tailwind + Lucide pre-loaded here — CSP is relaxed for declared sandbox pages -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; }
    body { background: #07070a; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div id="sandbox-head-styles"></div>
  <div id="sandbox-app"></div>

  <script>
    // Re-execute <script> tags that innerHTML silently ignores
    function runScripts(container) {
      container.querySelectorAll('script').forEach(function(old) {
        var fresh = document.createElement('script');
        Array.from(old.attributes).forEach(function(a) { fresh.setAttribute(a.name, a.value); });
        fresh.textContent = old.textContent;
        old.parentNode.replaceChild(fresh, old);
      });
    }

    // Inject <style> and <link> tags from the generated <head> so custom
    // CSS and Google Fonts from the AI output are preserved
    function injectHeadAssets(html) {
      var headMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
      if (!headMatch) return;
      var headHtml = headMatch[1];
      var container = document.getElementById('sandbox-head-styles');
      container.innerHTML = '';

      // Extract and inject <style> blocks — create nodes programmatically,
      // not via innerHTML, which is unreliable for <style> in strict sandboxes
      var styles = headHtml.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
      styles.forEach(function(s) {
        var cleanCSS = s.replace(/<\/?style[^>]*>/gi, '');
        var el = document.createElement('style');
        el.textContent = cleanCSS;
        container.appendChild(el);
      });

      // Extract and inject <link rel="stylesheet"> / Google Fonts links
      var links = headHtml.match(/<link[^>]*>/gi) || [];
      links.forEach(function(l) {
        if (/fonts\.googleapis\.com|fonts\.gstatic\.com|stylesheet/i.test(l)) {
          var tmp = document.createElement('div');
          tmp.innerHTML = l;
          var el = tmp.firstChild;
          if (el) container.appendChild(el);
        }
      });
    }

    // Extract <body> inner content from a full HTML document string
    function extractBody(html) {
      var m = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if (m) return m[1];
      // Fallback: strip everything up to </head>
      var headEnd = html.search(/<\/head>/i);
      if (headEnd !== -1) return html.slice(headEnd + 7);
      // Last resort: return as-is
      return html;
    }

    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || !data.htmlCode) return;

      injectHeadAssets(data.htmlCode);

      var app = document.getElementById('sandbox-app');
      app.innerHTML = extractBody(data.htmlCode);
      runScripts(app);

      try { lucide.createIcons(); } catch(e) {}
    });

    // Tell the parent popup that the sandbox is ready
    window.parent.postMessage({ sandboxReady: true }, '*');
  </script>
</body>
</html>
