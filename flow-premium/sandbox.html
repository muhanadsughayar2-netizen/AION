<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    try {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      };
    } catch(e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; }
    body { background: #07070a; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div id="sandbox-head-styles"></div>
  <div id="sandbox-app"></div>

  <script>
    // ── Global error suppressor ──────────────────────────────────────────────
    // AI-generated code can call onclick handlers like startQuiz() that aren't
    // defined yet, or reference undefined variables. These throw uncaught errors
    // that bubble up into Chrome's extension error panel. Intercept them here so
    // they stay as console warnings only and never pollute the error log.
    window.onerror = function(msg, src, line, col, err) {
      console.warn('[Aion preview]', msg, err ? (err.stack || '') : '');
      return true; // returning true suppresses the error from Chrome's panel
    };
    window.addEventListener('unhandledrejection', function(ev) {
      console.warn('[Aion preview rejection]', ev.reason);
      ev.preventDefault();
    });
    // ────────────────────────────────────────────────────────────────────────

    // Re-execute only syntactically complete <script> tags.
    // Uses new Function() to pre-validate inline scripts before DOM insertion —
    // replaceChild triggers synchronous browser compilation which bypasses try/catch,
    // so we validate first and skip any truncated/incomplete streaming chunks.
    function runScripts(container) {
      try {
        container.querySelectorAll('script').forEach(function(old) {
          try {
            // Skip empty inline scripts (external src= scripts pass through fine)
            if (!old.textContent.trim() && !old.hasAttribute('src')) return;

            // Pre-validate syntax of inline scripts before insertion
            if (old.textContent.trim()) {
              try {
                new Function(old.textContent);
              } catch(syntaxErr) {
                if (syntaxErr instanceof SyntaxError) {
                  // Incomplete/truncated script block — skip silently
                  return;
                }
              }
            }

            var fresh = document.createElement('script');
            Array.from(old.attributes).forEach(function(a) {
              try { fresh.setAttribute(a.name, a.value); } catch(e) {}
            });
            // Wrap inline scripts in IIFE so const/let never leak into the
            // global sandbox scope — prevents "already declared" crashes when
            // the preview re-evaluates on each streaming update.
            // Inner try/catch absorbs runtime errors from AI-generated code
            // (e.g. null.setAttribute, invalid selectors) so they never surface
            // as "Uncaught" errors in the Chrome extension error panel.
            if (old.textContent.trim()) {
              fresh.textContent = ";(function(){\ntry{\n" + old.textContent + "\n}catch(_snapE){console.warn('[SnapToAI preview]',_snapE.message||_snapE);}\n})();";
            } else {
              fresh.textContent = old.textContent;
            }
            if (old.parentNode) {
              old.parentNode.replaceChild(fresh, old);
            }
          } catch(e) {}
        });
      } catch(e) {}
    }

    // Inject <style> and <link> tags from the AI-generated <head>
    function injectHeadAssets(html) {
      try {
        var headMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
        if (!headMatch) return;
        var headHtml = headMatch[1];
        var container = document.getElementById('sandbox-head-styles');
        if (!container) return;
        container.innerHTML = '';

        // <style> blocks — create programmatically, never via innerHTML
        var styles = headHtml.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
        styles.forEach(function(s) {
          try {
            var css = s.replace(/<\/?style[^>]*>/gi, '');
            var el = document.createElement('style');
            el.textContent = css;
            container.appendChild(el);
          } catch(e) {}
        });

        // <link> tags — create programmatically to avoid innerHTML issues
        var linkRe = /<link([^>]*)>/gi;
        var linkMatch;
        while ((linkMatch = linkRe.exec(headHtml)) !== null) {
          try {
            var attrStr = linkMatch[1];
            if (!/fonts\.googleapis\.com|fonts\.gstatic\.com|stylesheet/i.test(attrStr)) continue;
            var el = document.createElement('link');
            var attrRe = /(\w[\w-]*)=["']([^"']*)["']/g;
            var am;
            while ((am = attrRe.exec(attrStr)) !== null) {
              try { el.setAttribute(am[1], am[2]); } catch(e) {}
            }
            // Fix common AI mistake: Google Fonts URLs must use :wght@ not :wght=
            // Wrong:  fonts.googleapis.com/css2?family=Inter:wght=400;700
            // Right:  fonts.googleapis.com/css2?family=Inter:wght@400;700
            if (el.href && /fonts\.googleapis\.com/.test(el.href)) {
              el.href = el.href
                .replace(/:ital,wght=/g, ':ital,wght@')
                .replace(/:wght=/g, ':wght@');
            }
            container.appendChild(el);
          } catch(e) {}
        }

        // Inline <script> tags from head — execute tailwind.config and other
        // setup scripts so custom colors/fonts are registered BEFORE body is
        // injected. Without this, Tailwind CDN never generates CSS for custom
        // tokens like text-electric, bg-pitch, font-heading etc.
        var headScriptRe = /<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi;
        var hsMatch;
        while ((hsMatch = headScriptRe.exec(headHtml)) !== null) {
          try {
            var code = hsMatch[1].trim();
            if (!code) continue;
            // Skip CDN loader stubs (very short or just comments)
            if (code.length < 5) continue;
            var el = document.createElement('script');
            el.textContent = code;
            container.appendChild(el);
          } catch(e) {}
        }
      } catch(e) {}
    }

    // Extract <body> content from a full HTML document string
    function extractBody(html) {
      try {
        var m = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        if (m) return m[1];
        var headEnd = html.search(/<\/head>/i);
        if (headEnd !== -1) return html.slice(headEnd + 7);
      } catch(e) {}
      return html;
    }

    // ── Strip unsafe iframe src values BEFORE DOM injection ─────────────────
    // Chrome fires a security error the moment an iframe with a chrome-extension://
    // src hits the DOM — post-injection cleanup is too late. We must sanitize
    // the HTML string first so no bad iframe ever enters the DOM.
    function sanitizeHtml(html) {
      // Replace src on any <iframe> that points to an extension page or relative
      // path (e.g. "sandbox.html", "ai-chat.html", "chrome-extension://...").
      // The regex is intentionally loose — it captures the src= value and blanks
      // it out; legitimate external iframes (https://) are left untouched.
      return html.replace(
        /(<iframe\b[^>]*?\bsrc\s*=\s*["'])([^"']*)(["'][^>]*>)/gi,
        function(match, pre, src, post) {
          try {
            var resolved = new URL(src, location.href);
            // Block chrome-extension://, relative extension pages, and empty/bad srcs
            if (resolved.origin === location.origin) {
              return pre + 'about:blank' + post;
            }
          } catch(e) {
            // Unparseable (javascript:, data:...) — blank it
            return pre + 'about:blank' + post;
          }
          return match; // safe external URL — leave as-is
        }
      );
    }

    window.addEventListener('message', function(event) {
      try {
        if (event.origin !== location.origin) return;
        if (event.source !== window.parent) return;
        var data = event.data;
        if (!data || !data.htmlCode) return;
        // Sanitise BEFORE any DOM insertion so Chrome never sees the bad src
        var safeHtml = sanitizeHtml(data.htmlCode);
        injectHeadAssets(safeHtml);
        var app = document.getElementById('sandbox-app');
        if (!app) return;
        app.innerHTML = extractBody(safeHtml);

        // Only execute scripts on the final complete render.
        // Partial streaming chunks may contain truncated <script> tags which
        // cause "Unexpected end of input" SyntaxErrors when cloned.
        if (data.isFinal) {
          runScripts(app);
          // Immediate call for icons already in DOM
          try { lucide.createIcons(); } catch(e) {}
          // Delayed call catches icons created by scripts that ran async
          setTimeout(function() { try { lucide.createIcons(); } catch(e) {} }, 150);
        }
      } catch(e) {}
    });

    // ── Defensive DOM patches ────────────────────────────────────────────────
    // AI-generated code frequently calls document.querySelector('#') with an
    // empty or invalid selector, or chains .setAttribute() onto a null element.
    // Patching at the sandbox level means every generated page gets these guards
    // for free, regardless of what the AI produces.
    (function() {
      // querySelector / querySelectorAll — validate selector before calling
      var _qs  = Document.prototype.querySelector;
      var _qsa = Document.prototype.querySelectorAll;
      var _eqs  = Element.prototype.querySelector;
      var _eqsa = Element.prototype.querySelectorAll;
      function safeSelector(sel) {
        if (!sel || typeof sel !== 'string') return false;
        try { document.createDocumentFragment().querySelector(sel); return true; }
        catch(e) { return false; }
      }
      Document.prototype.querySelector = function(sel) {
        return safeSelector(sel) ? _qs.call(this, sel) : null;
      };
      Document.prototype.querySelectorAll = function(sel) {
        return safeSelector(sel) ? _qsa.call(this, sel) : [];
      };
      Element.prototype.querySelector = function(sel) {
        return safeSelector(sel) ? _eqs.call(this, sel) : null;
      };
      Element.prototype.querySelectorAll = function(sel) {
        return safeSelector(sel) ? _eqsa.call(this, sel) : [];
      };
    })();

    // Notify parent popup that sandbox is ready
    try { window.parent.postMessage({ sandboxReady: true }, '*'); } catch(e) {}
  </script>
</body>
</html>
