<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI Sandbox</title>
  <script>
    (function() {
      // Storage shield: mock localStorage/sessionStorage if blocked by sandbox
      try { window.localStorage; } catch (e) {
        const mock = { getItem: () => null, setItem: () => {}, removeItem: () => {}, clear: () => {}, length: 0, key: () => null };
        Object.defineProperty(window, 'localStorage', { value: mock });
        Object.defineProperty(window, 'sessionStorage', { value: mock });
      }

      // querySelector safety: prevent crashes from invalid selectors like '#' or ''
      const _qs  = document.querySelector.bind(document);
      const _qsa = document.querySelectorAll.bind(document);
      document.querySelector = function(sel) {
        try { return (sel && sel.trim() && sel.trim() !== '#') ? _qs(sel) : null; } catch(e) { return null; }
      };
      document.querySelectorAll = function(sel) {
        try { return (sel && sel.trim() && sel.trim() !== '#') ? _qsa(sel) : []; } catch(e) { return []; }
      };

      // Global function fallbacks — defined NOW so onclick="" handlers never get
      // "X is not defined" even if the AI wrapped them in an IIFE by mistake.
      window.showTab = function(id, btn) {
        document.querySelectorAll('.tab-panel, [class*="tab-panel"]').forEach(function(p) { p.classList.remove('active'); });
        document.querySelectorAll('.tab-btn, [class*="tab-btn"]').forEach(function(b) { b.classList.remove('active'); });
        var panel = id ? document.getElementById(id) : null;
        if (panel) panel.classList.add('active');
        if (btn) btn.classList.add('active');
      };
      window.openModal = function(id) { var el = id ? document.getElementById(id) : null; if (el) el.style.display = 'flex'; };
      window.closeModal = function(id) { var el = id ? document.getElementById(id) : null; if (el) el.style.display = 'none'; };
      window.toggleMenu = function(id) { var el = id ? document.getElementById(id) : null; if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; };
      window.scrollToSection = function(id) { var el = id ? document.getElementById(id) : null; if (el) el.scrollIntoView({ behavior: 'smooth' }); };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    try {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      };
    } catch(e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; }
    body { background: #07070a; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div id="sandbox-head-styles"></div>
  <div id="sandbox-app"></div>

  <script>
    // Re-execute only syntactically complete <script> tags.
    // Uses new Function() to pre-validate inline scripts before DOM insertion —
    // replaceChild triggers synchronous browser compilation which bypasses try/catch,
    // so we validate first and skip any truncated/incomplete streaming chunks.
    function runScripts(container) {
      try {
        container.querySelectorAll('script').forEach(function(old) {
          try {
            // Skip empty inline scripts (external src= scripts pass through fine)
            if (!old.textContent.trim() && !old.hasAttribute('src')) return;

            // Pre-validate syntax of inline scripts before insertion
            if (old.textContent.trim()) {
              try {
                new Function(old.textContent);
              } catch(syntaxErr) {
                if (syntaxErr instanceof SyntaxError) {
                  // Incomplete/truncated script block — skip silently
                  return;
                }
              }
            }

            var fresh = document.createElement('script');
            Array.from(old.attributes).forEach(function(a) {
              try { fresh.setAttribute(a.name, a.value); } catch(e) {}
            });
            fresh.textContent = old.textContent;
            if (old.parentNode) {
              old.parentNode.replaceChild(fresh, old);
            }
          } catch(e) {}
        });
      } catch(e) {}
    }

    // Inject <style> and <link> tags from the AI-generated <head>
    function injectHeadAssets(html) {
      try {
        var headMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
        if (!headMatch) return;
        var headHtml = headMatch[1];
        var container = document.getElementById('sandbox-head-styles');
        if (!container) return;
        container.innerHTML = '';

        // <style> blocks — create programmatically, never via innerHTML
        var styles = headHtml.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
        styles.forEach(function(s) {
          try {
            var css = s.replace(/<\/?style[^>]*>/gi, '');
            var el = document.createElement('style');
            el.textContent = css;
            container.appendChild(el);
          } catch(e) {}
        });

        // <link> tags — create programmatically to avoid innerHTML issues
        var linkRe = /<link([^>]*)>/gi;
        var linkMatch;
        while ((linkMatch = linkRe.exec(headHtml)) !== null) {
          try {
            var attrStr = linkMatch[1];
            if (!/fonts\.googleapis\.com|fonts\.gstatic\.com|stylesheet/i.test(attrStr)) continue;
            var el = document.createElement('link');
            var attrRe = /(\w[\w-]*)=["']([^"']*)["']/g;
            var am;
            while ((am = attrRe.exec(attrStr)) !== null) {
              try { el.setAttribute(am[1], am[2]); } catch(e) {}
            }
            container.appendChild(el);
          } catch(e) {}
        }

        // Inline <script> tags from head — execute tailwind.config and other
        // setup scripts so custom colors/fonts are registered BEFORE body is
        // injected. Without this, Tailwind CDN never generates CSS for custom
        // tokens like text-electric, bg-pitch, font-heading etc.
        var headScriptRe = /<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi;
        var hsMatch;
        while ((hsMatch = headScriptRe.exec(headHtml)) !== null) {
          try {
            var code = hsMatch[1].trim();
            if (!code) continue;
            // Skip CDN loader stubs (very short or just comments)
            if (code.length < 5) continue;
            var el = document.createElement('script');
            el.textContent = code;
            container.appendChild(el);
          } catch(e) {}
        }
      } catch(e) {}
    }

    // Extract <body> content from a full HTML document string
    function extractBody(html) {
      try {
        var m = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        if (m) return m[1];
        var headEnd = html.search(/<\/head>/i);
        if (headEnd !== -1) return html.slice(headEnd + 7);
      } catch(e) {}
      return html;
    }

    window.addEventListener('message', function(event) {
      try {
        var data = event.data;
        if (!data || !data.htmlCode) return;
        injectHeadAssets(data.htmlCode);
        var app = document.getElementById('sandbox-app');
        if (!app) return;
        app.innerHTML = extractBody(data.htmlCode);
        // Only execute scripts on the final complete render.
        // Partial streaming chunks may contain truncated <script> tags which
        // cause "Unexpected end of input" SyntaxErrors when cloned.
        if (data.isFinal) {
          runScripts(app);
          // Immediate call for icons already in DOM
          try { lucide.createIcons(); } catch(e) {}
          // Delayed call catches icons created by scripts that ran async
          setTimeout(function() { try { lucide.createIcons(); } catch(e) {} }, 150);
        }
      } catch(e) {}
    });

    // Notify parent popup that sandbox is ready
    try { window.parent.postMessage({ sandboxReady: true }, '*'); } catch(e) {}
  </script>
</body>
</html>
