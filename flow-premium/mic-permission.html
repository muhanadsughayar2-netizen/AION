<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enable microphone — SnapToAI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a14 60%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px; width: 100%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,217,255,0.18);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
    }
    .emoji { font-size: 56px; line-height: 1; margin-bottom: 14px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
    p  { font-size: 14px; line-height: 1.55; margin: 0 0 18px; color: rgba(255,255,255,0.78); }
    button {
      cursor: pointer; border: 0; border-radius: 12px;
      padding: 14px 26px; font-size: 15px; font-weight: 600;
      background: linear-gradient(135deg, #00d9ff 0%, #6366f1 100%);
      color: #fff; box-shadow: 0 6px 24px rgba(99,102,241,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(99,102,241,0.55); }
    button:active { transform: translateY(0); }
    button[disabled] { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 18px; font-size: 13px; min-height: 22px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .hint { margin-top: 22px; font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.6; }
    code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎤</div>
    <h1>Let Snap hear you</h1>
    <p>SnapToAI's voice helper needs your microphone so you can talk to it. Click the button below and choose <b>Allow</b> when Chrome asks. You'll only do this once.</p>
    <button id="enableBtn">Enable microphone</button>
    <div id="status" class="status"></div>
    <div class="hint">If nothing happens, check the camera/mic icon in the right side of your address bar and make sure SnapToAI isn't blocked.</div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
