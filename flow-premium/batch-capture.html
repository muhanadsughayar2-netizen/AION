<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch URL Capture - SnapToAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1b2a 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .header h1 {
      font-size: 20px;
      color: #00d4ff;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 12px;
      color: #888;
    }
    
    .url-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .url-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .url-number {
      width: 24px;
      height: 24px;
      background: rgba(0, 212, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #00d4ff;
      flex-shrink: 0;
    }
    
    .url-input {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    
    .url-input:focus {
      outline: none;
      border-color: #00d4ff;
    }
    
    .url-input::placeholder {
      color: #666;
    }
    
    .capture-options {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .option-btn {
      flex: 1;
      padding: 12px 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .option-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .option-btn.active {
      border-color: #00d4ff;
      color: #00d4ff;
      background: rgba(0, 212, 255, 0.1);
    }
    
    .option-btn .icon {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }
    
    .go-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      margin-bottom: 12px;
    }
    
    .go-btn:hover:not(:disabled) {
      transform: scale(1.02);
    }
    
    .go-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .back-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
    }
    
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .status {
      text-align: center;
      margin-top: 16px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    
    .status.visible {
      display: block;
    }
    
    .status.error {
      color: #ff6b6b;
    }
    
    .status.success {
      color: #00ff88;
    }
    
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    
    .progress-bar.visible {
      display: block;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #00ff88);
      width: 0%;
      transition: width 0.3s;
    }
    
    .queue-info {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📸 Batch URL Capture</h1>
      <p>Enter up to 5 URLs to capture automatically</p>
    </div>
    
    <div class="url-inputs">
      <div class="url-row">
        <span class="url-number">1</span>
        <input type="url" class="url-input" id="url1" placeholder="https://example.com" autofocus>
      </div>
      <div class="url-row">
        <span class="url-number">2</span>
        <input type="url" class="url-input" id="url2" placeholder="https://...">
      </div>
      <div class="url-row">
        <span class="url-number">3</span>
        <input type="url" class="url-input" id="url3" placeholder="https://...">
      </div>
      <div class="url-row">
        <span class="url-number">4</span>
        <input type="url" class="url-input" id="url4" placeholder="https://...">
      </div>
      <div class="url-row">
        <span class="url-number">5</span>
        <input type="url" class="url-input" id="url5" placeholder="https://...">
      </div>
    </div>
    
    <div class="capture-options">
      <button class="option-btn active" data-mode="snap">
        <span class="icon">📷</span>
        Snap Only
      </button>
      <button class="option-btn" data-mode="fullpage">
        <span class="icon">📜</span>
        Full Page
      </button>
      <button class="option-btn" data-mode="both">
        <span class="icon">📷📜</span>
        Both
      </button>
    </div>
    
    <button class="go-btn" id="goBtn">🚀 Capture All URLs</button>
    <button class="back-btn" id="backBtn">← Back to Popup</button>
    
    <div class="status" id="status"></div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="queue-info" id="queueInfo">Queue: 0/9</div>
  </div>
  
  <script src="batch-capture.js"></script>
</body>
</html>
