<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch URL Capture - SnapToAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0f1a 0%, #0d1525 30%, #111a2e 60%, #0a0f1a 100%);
      min-height: 100vh;
      color: #e0e8f0;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated background glow */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(138, 43, 226, 0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 50%, rgba(0, 255, 136, 0.04) 0%, transparent 60%);
      animation: ambientGlow 15s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: -1;
    }
    
    @keyframes ambientGlow {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-5%, -5%) rotate(3deg); }
    }
    
    .container {
      max-width: 440px;
      margin: 0 auto;
      position: relative;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #00d4ff 0%, #00ff88 50%, #00d4ff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      animation: shimmer 3s ease-in-out infinite;
    }
    
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .header p {
      color: rgba(136, 153, 170, 0.9);
      font-size: 0.85rem;
    }
    
    /* Glassmorphism card style */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    
    .presets-section {
      padding: 14px;
      margin-bottom: 18px;
    }
    
    .presets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .presets-header h3 {
      font-size: 0.9rem;
      color: #00d4ff;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    .preset-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .preset-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 212, 255, 0.25);
      background: rgba(0, 212, 255, 0.08);
      color: #00d4ff;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .preset-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.5);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.2);
    }
    
    .preset-btn.active {
      background: rgba(0, 212, 255, 0.25);
      border-color: #00d4ff;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }
    
    .preset-delete {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 80, 80, 0.2);
      border: 1px solid rgba(255, 80, 80, 0.3);
      color: #ff6666;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .preset-delete:hover {
      background: rgba(255, 80, 80, 0.4);
      border-color: #ff6666;
      transform: scale(1.1);
    }
    
    .no-presets {
      color: rgba(102, 119, 136, 0.7);
      font-size: 0.8rem;
      font-style: italic;
    }
    
    .url-section {
      margin-bottom: 18px;
    }
    
    .url-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .url-row:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
    }
    
    .url-number {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d4ff, #0088cc);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 212, 255, 0.3);
    }
    
    .url-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    
    .url-input:focus {
      outline: none;
      border-color: rgba(0, 212, 255, 0.6);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.15),
                  inset 0 0 10px rgba(0, 212, 255, 0.05);
      background: rgba(0, 0, 0, 0.5);
    }
    
    .url-input::placeholder {
      color: rgba(102, 119, 136, 0.6);
    }
    
    .mode-toggle {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    
    .mode-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.3);
      color: rgba(136, 153, 170, 0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 14px;
    }
    
    .mode-btn:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
    }
    
    .mode-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: rgba(0, 212, 255, 0.5);
      color: #00d4ff;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }
    
    .mode-btn[data-mode="fullpage"].active {
      background: rgba(255, 136, 0, 0.15);
      border-color: rgba(255, 136, 0, 0.5);
      color: #ff8800;
      box-shadow: 0 0 10px rgba(255, 136, 0, 0.2);
    }
    
    /* Delete URL button */
    .url-delete {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(255, 80, 80, 0.2);
      background: rgba(255, 80, 80, 0.08);
      color: rgba(255, 100, 100, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .url-delete:hover {
      background: rgba(255, 80, 80, 0.2);
      border-color: rgba(255, 80, 80, 0.5);
      color: #ff6666;
      transform: scale(1.05);
    }
    
    /* Add URL button */
    .add-url-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed rgba(0, 212, 255, 0.3);
      background: rgba(0, 212, 255, 0.05);
      color: rgba(0, 212, 255, 0.7);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }
    
    .add-url-btn:hover {
      background: rgba(0, 212, 255, 0.1);
      border-color: rgba(0, 212, 255, 0.5);
      color: #00d4ff;
    }
    
    .save-section {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    
    .save-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    
    .save-input:focus {
      outline: none;
      border-color: rgba(0, 255, 136, 0.5);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
    }
    
    .save-input::placeholder {
      color: rgba(102, 119, 136, 0.6);
    }
    
    .save-btn {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #00ff88, #00cc66);
      color: #003322;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2);
    }
    
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 255, 136, 0.35);
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .capture-btn {
      padding: 16px 28px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #00d4ff 0%, #0088ff 50%, #00d4ff 100%);
      background-size: 200% 100%;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
      animation: captureShimmer 3s ease-in-out infinite;
    }
    
    @keyframes captureShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .capture-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 212, 255, 0.45);
    }
    
    .capture-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      animation: none;
    }
    
    .back-btn {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(136, 153, 170, 0.8);
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .back-btn:hover {
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    
    .status {
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      margin-top: 14px;
      display: none;
      font-weight: 500;
    }
    
    .status.info {
      display: block;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.25);
      color: #00d4ff;
    }
    
    .status.success {
      display: block;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.25);
      color: #00ff88;
    }
    
    .status.error {
      display: block;
      background: rgba(255, 80, 80, 0.1);
      border: 1px solid rgba(255, 80, 80, 0.25);
      color: #ff6666;
    }
    
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 14px;
      font-size: 0.75rem;
      color: rgba(102, 119, 136, 0.8);
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .legend-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    
    .legend-icon.snap {
      background: rgba(0, 212, 255, 0.15);
      color: #00d4ff;
    }
    
    .legend-icon.full {
      background: rgba(255, 136, 0, 0.15);
      color: #ff8800;
    }
    
    .progress-bar {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
      display: none;
    }
    
    .progress-bar.visible {
      display: block;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #00ff88, #00d4ff);
      background-size: 200% 100%;
      width: 0%;
      transition: width 0.3s;
      animation: progressShimmer 2s linear infinite;
    }
    
    @keyframes progressShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    
    .queue-info {
      text-align: center;
      font-size: 11px;
      color: rgba(102, 119, 136, 0.6);
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✨ Batch URL Capture</h1>
      <p>Configure URLs with individual capture modes</p>
    </div>
    
    <div class="presets-section glass-card">
      <div class="presets-header">
        <h3>📁 Saved Presets</h3>
      </div>
      <div class="preset-list" id="presetList">
        <span class="no-presets">No saved presets yet</span>
      </div>
    </div>
    
    <div class="legend">
      <div class="legend-item">
        <div class="legend-icon snap">📷</div>
        <span>Snap</span>
      </div>
      <div class="legend-item">
        <div class="legend-icon full">📄</div>
        <span>Full Page</span>
      </div>
    </div>
    
    <div class="url-section glass-card" id="urlSection">
      <div class="url-row">
        <div class="url-number">1</div>
        <input type="url" class="url-input" placeholder="https://example.com" data-index="0">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="snap" data-index="0" title="Snap">📷</button>
          <button class="mode-btn" data-mode="fullpage" data-index="0" title="Full Page">📄</button>
        </div>
        <button class="url-delete" data-index="0" title="Clear URL">×</button>
      </div>
      <div class="url-row">
        <div class="url-number">2</div>
        <input type="url" class="url-input" placeholder="https://..." data-index="1">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="snap" data-index="1" title="Snap">📷</button>
          <button class="mode-btn" data-mode="fullpage" data-index="1" title="Full Page">📄</button>
        </div>
        <button class="url-delete" data-index="1" title="Clear URL">×</button>
      </div>
      <div class="url-row">
        <div class="url-number">3</div>
        <input type="url" class="url-input" placeholder="https://..." data-index="2">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="snap" data-index="2" title="Snap">📷</button>
          <button class="mode-btn" data-mode="fullpage" data-index="2" title="Full Page">📄</button>
        </div>
        <button class="url-delete" data-index="2" title="Clear URL">×</button>
      </div>
      <div class="url-row">
        <div class="url-number">4</div>
        <input type="url" class="url-input" placeholder="https://..." data-index="3">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="snap" data-index="3" title="Snap">📷</button>
          <button class="mode-btn" data-mode="fullpage" data-index="3" title="Full Page">📄</button>
        </div>
        <button class="url-delete" data-index="3" title="Clear URL">×</button>
      </div>
      <div class="url-row">
        <div class="url-number">5</div>
        <input type="url" class="url-input" placeholder="https://..." data-index="4">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="snap" data-index="4" title="Snap">📷</button>
          <button class="mode-btn" data-mode="fullpage" data-index="4" title="Full Page">📄</button>
        </div>
        <button class="url-delete" data-index="4" title="Clear URL">×</button>
      </div>
    </div>
    
    <div class="save-section">
      <input type="text" class="save-input" id="presetName" placeholder="Preset name (e.g., Tesla Dashboard)">
      <button class="save-btn" id="savePresetBtn">💾 Save</button>
    </div>
    
    <div class="actions">
      <button class="capture-btn" id="captureBtn">
        ⚡ Capture All URLs
      </button>
      <button class="back-btn" id="backBtn">← Back to Popup</button>
    </div>
    
    <div class="status" id="status"></div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="queue-info" id="queueInfo">Queue: 0/9</div>
  </div>
  
  <script src="batch-capture.js"></script>
</body>
</html>
