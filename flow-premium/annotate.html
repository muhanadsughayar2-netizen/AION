<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate Screenshot - Flow</title>
  <link rel="stylesheet" href="annotate.css">
</head>
<body>
  <div class="annotate-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-section">
        <button class="tool-btn active" data-tool="highlight" title="Draw highlights">✨</button>
        <button class="tool-btn" data-tool="callout" title="Add numbers">🔢</button>
        <button class="tool-btn" data-tool="text" title="Add text">✏️</button>
        <button class="tool-btn" data-tool="blur" title="Blur sensitive areas">🔒</button>
      </div>
      
      <div class="toolbar-section">
        <button class="sticker-btn" data-text="🐛 BUG">BUG</button>
        <button class="sticker-btn" data-text="⚠️ IMPORTANT">IMPORTANT</button>
        <button class="sticker-btn" data-text="👉 FOCUS">FOCUS</button>
        <div id="customStickers"></div>
        <button id="createStickerBtn" class="create-sticker-btn" title="Create your own sticker">+ Custom</button>
      </div>
      
      <div class="toolbar-section">
        <input type="color" id="colorPicker" value="#00d9ff" title="Color">
        <div class="size-control">
          <input type="range" id="brushSize" min="4" max="40" value="12">
          <span id="sizeValue">12px</span>
        </div>
      </div>
      
      <div class="toolbar-section">
        <button id="undoBtn" class="tool-btn" title="Undo">↩️</button>
        <button id="clearBtn" class="tool-btn" title="Clear all">🗑️</button>
        <button id="saveBtn" class="save-btn">💾 Save</button>
        <button id="cancelBtn" class="cancel-btn">✖ Cancel</button>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
      <input type="text" id="textInput" class="text-input" style="display: none;" placeholder="Type text...">
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status">Draw highlights, add numbers, or add text. All draggable!</span>
    </div>
  </div>

  <script src="annotate.js"></script>
</body>
</html>
