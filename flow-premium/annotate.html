<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate Screenshot - Flow</title>
  <link rel="stylesheet" href="annotate.css">
</head>
<body>
  <div class="annotate-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-section">
        <span class="section-label">Tools</span>
        <button class="tool-btn active" data-tool="highlight" title="Highlight: Draw glowing strokes">
          ✨
        </button>
        <button class="tool-btn" data-tool="spotlight" title="Spotlight: Brighten area, dim rest">
          🎯
        </button>
        <button class="tool-btn" data-tool="redact" title="Redact: Pixelate sensitive info">
          🔒
        </button>
        <button class="tool-btn" data-tool="callout" title="Callout: Click to add numbered marker">
          🔢
        </button>
        <button class="tool-btn" data-tool="text" title="Text: Click to add custom text">
          ✏️
        </button>
      </div>
      
      <div class="toolbar-section">
        <span class="section-label">Quick Labels</span>
        <button class="sticker-btn" data-text="🐛 BUG" title="Add BUG sticker (drag to move)">BUG</button>
        <button class="sticker-btn" data-text="⚠️ IMPORTANT" title="Add IMPORTANT sticker (drag to move)">IMPORTANT</button>
        <button class="sticker-btn" data-text="👉 FOCUS HERE" title="Add FOCUS sticker (drag to move)">FOCUS</button>
      </div>
      
      <div class="toolbar-section">
        <input type="color" id="colorPicker" value="#00d9ff" title="Choose color">
        <div class="size-control">
          <label for="brushSize">Size:</label>
          <input type="range" id="brushSize" min="4" max="40" value="12">
          <span id="sizeValue">12px</span>
        </div>
        <button id="undoBtn" class="tool-btn" title="Undo last annotation">↩️</button>
        <button id="clearBtn" class="tool-btn" title="Clear all annotations">🗑️</button>
      </div>
      
      <div class="toolbar-section">
        <button id="saveBtn" class="save-btn">💾 Save</button>
        <button id="cancelBtn" class="cancel-btn">✖ Cancel</button>
      </div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
      <input type="text" id="textInput" class="text-input" style="display: none;" placeholder="Type text...">
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status">ALL annotations are draggable! Hover and drag to reposition. Press DELETE to remove. Change color and size anytime.</span>
    </div>
  </div>

  <script src="annotate.js"></script>
</body>
</html>
