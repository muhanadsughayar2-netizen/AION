<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Editor</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="annotate.css">
</head>
<body>
  <!-- Batch Capture Banner (shown when in batch mode) -->
  <div id="batchBanner" class="batch-banner" style="display: none;">
    <div class="batch-icon">📸</div>
    <div class="batch-text">
      <span class="batch-progress">Batch Capture: <span id="batchCurrent">1</span> of <span id="batchTotal">3</span></span>
      <span class="batch-url" id="batchUrl"></span>
    </div>
    <div class="batch-action">Save to continue →</div>
  </div>
  
  <div class="annotate-container">
    <!-- Professional Top Toolbar -->
    <div class="editor-toolbar">
      <!-- Left: Core Tools -->
      <div class="toolbar-group">
        <button class="tool-btn active" data-tool="select" title="Select & Move (V)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
            <path d="M13 13l6 6"/>
          </svg>
        </button>
        <button class="tool-btn" data-tool="crop" id="cropBtn" title="Crop Image (C)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2v4h12v12h4"/>
            <path d="M6 6H2"/>
            <path d="M18 18v4"/>
            <rect x="6" y="6" width="12" height="12" rx="1"/>
          </svg>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-btn" data-tool="callout" title="Add AI Insight Note (N)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="url(#aiGradient)"/>
            <defs>
              <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#7000ff;stop-opacity:1" />
              </linearGradient>
            </defs>
          </svg>
        </button>
        <button class="tool-btn" data-tool="rectangle" title="Draw Rectangle (R)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Draw Arrow (A)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="19" x2="19" y2="5"/>
            <polyline points="10 5 19 5 19 14"/>
          </svg>
        </button>
        <button class="tool-btn" data-tool="special" id="specialBtn" title="Add Emoji Sticker (E)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </button>
        <!-- Emoji Panel -->
        <div id="emojiPanel" class="emoji-panel" style="display: none;">
          <div class="emoji-grid">
            <button class="emoji-item" data-emoji="🔥">🔥</button>
            <button class="emoji-item" data-emoji="💯">💯</button>
            <button class="emoji-item" data-emoji="⚡">⚡</button>
            <button class="emoji-item" data-emoji="✨">✨</button>
            <button class="emoji-item" data-emoji="✅">✅</button>
            <button class="emoji-item" data-emoji="❌">❌</button>
            <button class="emoji-item" data-emoji="⚠️">⚠️</button>
            <button class="emoji-item" data-emoji="❗">❗</button>
            <button class="emoji-item" data-emoji="❓">❓</button>
            <button class="emoji-item" data-emoji="💡">💡</button>
            <button class="emoji-item" data-emoji="👍">👍</button>
            <button class="emoji-item" data-emoji="👎">👎</button>
            <button class="emoji-item" data-emoji="👆">👆</button>
            <button class="emoji-item" data-emoji="👇">👇</button>
            <button class="emoji-item" data-emoji="👈">👈</button>
            <button class="emoji-item" data-emoji="👉">👉</button>
            <button class="emoji-item" data-emoji="👀">👀</button>
            <button class="emoji-item" data-emoji="🎯">🎯</button>
            <button class="emoji-item" data-emoji="📌">📌</button>
            <button class="emoji-item" data-emoji="🔔">🔔</button>
            <button class="emoji-item" data-emoji="🚀">🚀</button>
            <button class="emoji-item" data-emoji="💎">💎</button>
            <button class="emoji-item" data-emoji="🏆">🏆</button>
            <button class="emoji-item" data-emoji="❤️">❤️</button>
          </div>
        </div>
      </div>

      <!-- Center: Color & Size -->
      <div class="toolbar-group">
        <div class="color-picker-wrap" title="Annotation Color">
          <input type="color" id="colorPicker" value="#007AFF">
        </div>
        <div class="size-control" title="Brush Size">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" opacity="0.5">
            <circle cx="12" cy="12" r="4"/>
          </svg>
          <input type="range" id="brushSize" min="4" max="40" value="4">
          <span id="sizeValue">4</span>
        </div>
      </div>

      <!-- Center-Right: Decorations -->
      <div class="toolbar-group">
        <button id="toggleBrowserFrame" class="tool-btn icon-text" title="Add Browser Frame">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="18" rx="2"/>
            <line x1="2" y1="9" x2="22" y2="9"/>
            <circle cx="6" cy="6" r="1" fill="currentColor"/>
            <circle cx="10" cy="6" r="1" fill="currentColor"/>
            <circle cx="14" cy="6" r="1" fill="currentColor"/>
          </svg>
          <span>Frame</span>
        </button>
        <select id="frameStyle" class="mini-select" style="display: none;">
          <option value="mac" selected>macOS</option>
          <option value="windows">Windows</option>
          <option value="minimal">Minimal</option>
        </select>
        <select id="frameUrlPosition" class="mini-select" style="display: none;">
          <option value="top" selected>Top</option>
          <option value="bottom">Bottom</option>
        </select>
        <input type="text" id="urlInput" class="url-input" readonly placeholder="Auto URL" style="display: none;">
        
        <button id="toggleBorder" class="tool-btn icon-text active" title="Toggle Border">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 2"/>
          </svg>
          <span>Border</span>
        </button>
        <input type="color" id="borderColor" value="#007AFF" class="color-mini" title="Border Color" style="display: none;">
        <select id="borderWidth" class="mini-select">
          <option value="2" selected>2px</option>
          <option value="4">4px</option>
          <option value="8">8px</option>
        </select>
      </div>

      <!-- Right: Zoom -->
      <div class="toolbar-group">
        <button id="zoomOut" class="tool-btn mini" title="Zoom Out (-)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <span id="zoomLevel" class="zoom-label">100%</span>
        <button id="zoomIn" class="tool-btn mini" title="Zoom In (+)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>

      <!-- Right: Actions -->
      <div class="toolbar-group actions">
        <button id="undoBtn" class="tool-btn" title="Undo (Ctrl+Z)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6"/>
            <path d="M3 13c0-4.97 4.03-9 9-9a9 9 0 0 1 6.36 2.64"/>
          </svg>
        </button>
        <button id="redoBtn" class="tool-btn" title="Redo (Ctrl+Y)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 7v6h-6"/>
            <path d="M21 13c0-4.97-4.03-9-9-9a9 9 0 0 0-6.36 2.64"/>
          </svg>
        </button>
        <button id="clearBtn" class="tool-btn danger" title="Clear All Annotations">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
        <div class="toolbar-divider"></div>
        <button id="saveBtn" class="btn-primary" title="Save Changes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Save
        </button>
        <button id="cancelBtn" class="btn-secondary" title="Close Without Saving">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Close
        </button>
      </div>

      <!-- Crop Controls (hidden by default) -->
      <div id="cropControls" class="toolbar-group crop-actions" style="display:none;">
        <button id="doneCropBtn" class="btn-success" title="Apply Crop">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Apply
        </button>
        <button id="cancelCropBtn" class="btn-secondary" title="Cancel Crop">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Cancel
        </button>
      </div>
    </div>

    <!-- Custom Stickers Bar (optional) -->
    <div class="stickers-bar">
      <div id="customStickers"></div>
      <button id="createStickerBtn" class="add-sticker-btn" title="Create Custom Sticky Note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        + Add Sticky Notes
      </button>
    </div>

    <!-- Page Navigation (Full Page mode) -->
    <div id="pageNav" class="page-nav" style="display: none;">
      <button id="prevPage" class="nav-btn" title="Previous Page (←)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span id="pageIndicator" class="page-indicator">Page 1 / 1</span>
      <button id="nextPage" class="nav-btn" title="Next Page (→)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-container">
      <div id="canvasWrapper" class="canvas-wrapper">
        <!-- Browser Frame Overlay -->
        <div id="browserFrameOverlay" class="browser-frame-overlay" style="display: none;">
          <div class="frame-traffic-lights">
            <div class="traffic-light red"></div>
            <div class="traffic-light yellow"></div>
            <div class="traffic-light green"></div>
          </div>
          <div class="frame-url-bar">
            <span class="frame-url-text" id="frameUrlText">🔒 example.com</span>
          </div>
          <div class="frame-windows-controls" style="display: none;">
            <div class="win-btn">─</div>
            <div class="win-btn">☐</div>
            <div class="win-btn close">✕</div>
          </div>
        </div>
        <canvas id="canvas"></canvas>
      </div>
    </div>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status">Click tools to annotate • Drag to move • Backspace to delete</span>
    </div>

    <!-- WOW FACTOR WORKSPACE -->
    <div class="edit-workspace" id="wowWorkspace" style="display: none;">
      <div class="brain-dump-section">
        <input type="text" class="snap-title" placeholder="Untitled Snap..." id="wowTitle">
        <textarea class="free-text-area" placeholder="Start typing your thoughts here..." id="wowDescription"></textarea>
      </div>

      <div class="insights-container" id="wowInsights">
        <h3 class="section-label">AI INSIGHTS</h3>
        <!-- Insight cards injected here -->
      </div>
    </div>
  </div>

  <script src="annotate.js"></script>
</body>
</html>
