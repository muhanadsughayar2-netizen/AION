<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapToAI</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-theme">
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📸</span>
                <span class="logo-text">Snap To AI</span>
            </div>
            <div class="header-actions">
                <button id="helpButton" class="icon-btn" title="Tutorials">?</button>
                <button id="settingsButton" class="icon-btn" title="Settings">⚙️</button>
            </div>
        </header>

        <!-- Main Actions -->
        <main class="main-content">
            <div class="primary-actions">
                <button id="snapButton" class="action-card primary">
                    <div class="action-icon">📸</div>
                    <div class="action-label">Snap</div>
                    <div class="action-desc">Viewport</div>
                </button>
                <button id="snipButton" class="action-card secondary">
                    <div class="action-icon">✂️</div>
                    <div class="action-label">Snip</div>
                    <div class="action-desc">Area</div>
                </button>
                <button id="fullPageButton" class="action-card accent">
                    <div class="action-icon">📄</div>
                    <div class="action-label">Full Page</div>
                    <div class="action-desc">Scrolling</div>
                </button>
            </div>

            <div class="secondary-actions">
                <button id="agentButton" class="btn btn-purple">
                    <span class="btn-icon">🔮</span> Magic Agent
                </button>
                <button id="uploadModeButton" class="btn btn-outline">
                    <span class="btn-icon">🚀</span> Upload Mode
                </button>
            </div>
        </main>

        <!-- Pin Extension Tip -->
        <div id="pinTip" class="pin-tip">
            <div class="pin-tip-title">🚀 Launch Your Intelligence Layer</div>
            <div class="pin-tip-text">Click <span class="star">★</span> <span class="green">Extensions</span> → Pin <span class="pin">📌</span> <span class="purple">Snap To AI</span></div>
            <div class="pin-tip-done">That's it! You're ready to snap.</div>
        </div>
    </div>

    <!-- Modals & Overlays -->
    <div id="fullPageOverlay" class="overlay hidden">
        <div class="overlay-content">
            <div class="spinner"></div>
            <p id="fullPageStatus">Capturing...</p>
            <button id="cancelFullPage" class="btn btn-danger btn-sm">Cancel</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
