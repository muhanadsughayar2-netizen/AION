<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Aion AI</title>
  <script src="theme.js"></script>
  <script src="branding.js"></script>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Google Sans', 'Inter', Roboto, -apple-system, sans-serif;
      background: #202124;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .card {
      background: #2d2e30;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 36px 28px 32px;
    }

    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-glow-bg {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45,212,191,0.18) 0%, rgba(45,212,191,0.04) 55%, transparent 75%);
      animation: glowPulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%       { transform: scale(1.15); opacity: 1; }
    }

    .logo-svg-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Magic spinning ring around the logo ── */
    .logo-ring {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, #2dd4bf 12%, transparent 26%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      animation: orbitSpin 3.5s linear infinite;
    }

    .logo-ring-2 {
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: conic-gradient(from 90deg, transparent 0%, #a78bfa 16%, transparent 32%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      animation: orbitSpin2 5s linear infinite;
    }

    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes orbitSpin2 {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    /* ── Logo image pulse ── */
    .logo-img {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: block;
      animation: camPulse 3s ease-in-out infinite;
    }

    @keyframes camPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(45,212,191,0.5)); }
      50%       { filter: drop-shadow(0 0 14px rgba(45,212,191,0.85)); }
    }

    /* ── Floating particles ── */
    .particle {
      animation: particleFloat linear infinite;
      transform-origin: center;
    }

    .p1 { animation-duration: 3.2s; animation-delay: 0s; }
    .p2 { animation-duration: 4.1s; animation-delay: -1.1s; }
    .p3 { animation-duration: 2.9s; animation-delay: -0.6s; }
    .p4 { animation-duration: 3.7s; animation-delay: -2.0s; }

    @keyframes particleFloat {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
      30%  { opacity: 1; }
      70%  { opacity: 0.8; }
      100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(1.2); }
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1px;
      font-family: 'Google Sans', 'Inter', Roboto, sans-serif;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.3px;
      font-family: 'Google Sans', 'Inter', Roboto, sans-serif;
      color: #bdc1c6;
      margin-bottom: 28px;
    }

    .tagline-google {
      font-weight: 700;
      background: linear-gradient(90deg, #4285F4 0%, #EA4335 35%, #FBBC05 65%, #34A853 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .feature-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #9aa0a6;
    }

    .feature-pill.vision { border-color: rgba(66,133,244,0.35); color: #4285F4; }
    .feature-pill.image  { border-color: rgba(251,188,5,0.35);  color: #FBBC05; }
    .feature-pill.music  { border-color: rgba(52,168,83,0.35);  color: #34A853; }
    .feature-pill.video  { border-color: rgba(138,180,248,0.35); color: #8ab4f8; }
    .feature-pill.build  { border-color: rgba(45,212,191,0.4);  color: #2dd4bf; background: rgba(45,212,191,0.06); }

    /* ── Feature list ── */
    .features-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      text-align: left;
    }

    .feat-row {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .feat-icon {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 10px;
      border: 1px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .feat-text { flex: 1; }

    .feat-title {
      font-size: 13px;
      font-weight: 700;
      color: #e8eaed;
      margin-bottom: 2px;
    }

    .feat-desc {
      font-size: 12px;
      color: #80868b;
      line-height: 1.5;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 0 0 24px;
    }

    .pin-title {
      font-size: 13px;
      font-weight: 600;
      color: #e8eaed;
      margin-bottom: 16px;
    }

    .pin-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pin-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .pin-step-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 20px;
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .pin-step-icon.puzzle {
      border-color: rgba(66,133,244,0.35);
      animation: stepPulse1 5s ease-in-out infinite;
    }

    .pin-step-icon.ext {
      font-size: 10px;
      font-weight: 700;
      color: #4285F4;
      border-color: rgba(66,133,244,0.25);
      animation: stepPulse2 5s ease-in-out infinite;
      padding: 0 6px;
    }

    .pin-step-icon.check {
      background: rgba(52,168,83,0.1);
      border-color: rgba(52,168,83,0.35);
      color: #34A853;
      font-size: 22px;
      animation: stepPulse3 5s ease-in-out infinite;
    }

    .pin-cursor {
      position: absolute;
      bottom: -4px;
      right: -2px;
      opacity: 0;
      animation: pinCursorMove 5s ease-in-out infinite;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
    }

    .pin-click-ring {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #4285F4;
      bottom: 2px;
      right: 4px;
      opacity: 0;
      animation: pinClickRing 5s ease-in-out infinite;
    }

    .pin-cursor-2 {
      position: absolute;
      bottom: -4px;
      right: 8px;
      opacity: 0;
      animation: pinCursorMove2 5s ease-in-out infinite;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
    }

    .pin-click-ring-2 {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #34A853;
      bottom: 2px;
      right: 14px;
      opacity: 0;
      animation: pinClickRing2 5s ease-in-out infinite;
    }

    .pin-arrow {
      color: rgba(255,255,255,0.2);
      font-size: 14px;
      margin-top: -14px;
    }

    .pin-arrow.a1 { animation: arrowFade1 5s ease-in-out infinite; }
    .pin-arrow.a2 { animation: arrowFade2 5s ease-in-out infinite; }

    .pin-step-label {
      font-size: 10px;
      color: #80868b;
    }

    .pin-step-label.ready {
      color: #34A853;
      font-weight: 600;
    }

    @keyframes stepPulse1 {
      0%, 5%   { box-shadow: none; }
      10%      { box-shadow: 0 0 12px rgba(66,133,244,0.4); border-color: rgba(66,133,244,0.7); }
      25%, 100%{ box-shadow: none; border-color: rgba(66,133,244,0.35); }
    }

    @keyframes stepPulse2 {
      0%, 35%  { box-shadow: none; }
      42%      { box-shadow: 0 0 12px rgba(66,133,244,0.3); border-color: rgba(66,133,244,0.6); }
      55%, 100%{ box-shadow: none; border-color: rgba(66,133,244,0.25); }
    }

    @keyframes stepPulse3 {
      0%, 65%  { box-shadow: none; transform: scale(1); }
      72%      { box-shadow: 0 0 14px rgba(52,168,83,0.4); transform: scale(1.08); border-color: rgba(52,168,83,0.7); }
      80%, 100%{ box-shadow: none; transform: scale(1); border-color: rgba(52,168,83,0.35); }
    }

    @keyframes pinCursorMove {
      0%, 4%  { opacity: 0; transform: translate(12px, 12px); }
      10%     { opacity: 1; transform: translate(0, 0); }
      18%     { opacity: 1; }
      22%     { opacity: 0; transform: translate(-8px, -4px); }
      100%    { opacity: 0; }
    }

    @keyframes pinClickRing {
      0%, 13% { opacity: 0; transform: scale(0.4); }
      15%     { opacity: 0.8; transform: scale(1); }
      20%     { opacity: 0; transform: scale(1.6); }
      100%    { opacity: 0; }
    }

    @keyframes pinCursorMove2 {
      0%, 34% { opacity: 0; transform: translate(12px, 12px); }
      40%     { opacity: 1; transform: translate(0, 0); }
      48%     { opacity: 1; }
      52%     { opacity: 0; transform: translate(-6px, -4px); }
      100%    { opacity: 0; }
    }

    @keyframes pinClickRing2 {
      0%, 44% { opacity: 0; transform: scale(0.4); }
      46%     { opacity: 0.8; transform: scale(1); }
      50%     { opacity: 0; transform: scale(1.6); }
      100%    { opacity: 0; }
    }

    @keyframes arrowFade1 {
      0%, 18% { opacity: 0.15; }
      22%     { opacity: 1; color: #4285F4; }
      30%, 100%{ opacity: 0.15; color: rgba(255,255,255,0.2); }
    }

    @keyframes arrowFade2 {
      0%, 50% { opacity: 0.15; }
      55%     { opacity: 1; color: #34A853; }
      65%, 100%{ opacity: 0.15; color: rgba(255,255,255,0.2); }
    }

    .privacy {
      font-size: 12px;
      color: #5f6368;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-wrap">
        <div class="logo-glow-bg"></div>
        <div class="logo-svg-wrap">
          <div class="logo-ring"></div>
          <div class="logo-ring-2"></div>
          <img src="icons/icon128.png" alt="Aion AI" class="logo-img">
        </div>
      </div>
      <h1>Aion</h1>
      <p class="tagline">Powered by <span class="tagline-google">Google AI Studio</span></p>

      <div class="features">
        <span class="feature-pill vision">🔍 Vision</span>
        <span class="feature-pill image">✨ Image</span>
        <span class="feature-pill music">🎵 Music</span>
        <span class="feature-pill video">🎬 Video</span>
        <span class="feature-pill" style="border-color:rgba(244,114,182,0.35);color:#f472b6;">🎙️ Broadcast</span>
        <span class="feature-pill" style="border-color:rgba(96,165,250,0.35);color:#60a5fa;">🧭 Autopilot</span>
        <span class="feature-pill" style="border-color:rgba(167,139,250,0.35);color:#a78bfa;">✦ Custom Prompts</span>
        <span class="feature-pill build">🏗️ Build</span>
      </div>

      <hr class="divider">

      <div class="pin-title">Pin it to get started</div>
      <div class="pin-steps">
        <div class="pin-step">
          <div class="pin-step-icon puzzle">
            🧩
            <div class="pin-cursor">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M5 3l14 9-6 1.5L10 20z"/></svg>
            </div>
            <div class="pin-click-ring"></div>
          </div>
          <span class="pin-step-label">Click the puzzle icon</span>
        </div>
        <span class="pin-arrow a1">→</span>
        <div class="pin-step">
          <div class="pin-step-icon ext">
            📸 Aion AI 📌
            <div class="pin-cursor-2">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M5 3l14 9-6 1.5L10 20z"/></svg>
            </div>
            <div class="pin-click-ring-2"></div>
          </div>
          <span class="pin-step-label">Click the pin</span>
        </div>
        <span class="pin-arrow a2">→</span>
        <div class="pin-step">
          <div class="pin-step-icon check">✓</div>
          <span class="pin-step-label ready">Ready!</span>
        </div>
      </div>
    </div>

    <p class="privacy">🔒 Your screenshots stay private</p>
  </div>
  <script src="welcome.js"></script>
</body>
</html>
