<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to AION</title>
  <script src="theme.js"></script>
  <script src="branding.js"></script>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Google Sans', 'Inter', Roboto, -apple-system, sans-serif;
      background: #202124;
      color: #e8eaed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .card {
      background: #2d2e30;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 36px 28px 32px;
    }

    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-glow-bg {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45,212,191,0.18) 0%, rgba(45,212,191,0.04) 55%, transparent 75%);
      animation: glowPulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%       { transform: scale(1.15); opacity: 1; }
    }

    .logo-svg-wrap {
      position: relative;
      width: 88px;
      height: 88px;
    }

    .logo-svg-wrap svg { display: block; }

    /* ── Orbital ring ── */
    .orbit-ring {
      animation: orbitSpin 6s linear infinite;
      transform-origin: 44px 44px;
    }

    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Counter-spin ring ── */
    .orbit-ring-2 {
      animation: orbitSpin2 9s linear infinite;
      transform-origin: 44px 44px;
    }

    @keyframes orbitSpin2 {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    /* ── Camera body pulse ── */
    .cam-body {
      animation: camPulse 3s ease-in-out infinite;
      transform-origin: 44px 44px;
    }

    @keyframes camPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(45,212,191,0.5)); }
      50%       { filter: drop-shadow(0 0 14px rgba(45,212,191,0.85)); }
    }

    /* ── Lens shimmer ── */
    .lens-shine {
      animation: lensShine 2.8s ease-in-out infinite;
    }

    @keyframes lensShine {
      0%, 100% { opacity: 0.15; }
      50%       { opacity: 0.5; }
    }

    /* ── Floating particles ── */
    .particle {
      animation: particleFloat linear infinite;
      transform-origin: center;
    }

    .p1 { animation-duration: 3.2s; animation-delay: 0s; }
    .p2 { animation-duration: 4.1s; animation-delay: -1.1s; }
    .p3 { animation-duration: 2.9s; animation-delay: -0.6s; }
    .p4 { animation-duration: 3.7s; animation-delay: -2.0s; }

    @keyframes particleFloat {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
      30%  { opacity: 1; }
      70%  { opacity: 0.8; }
      100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(1.2); }
    }

    h1 {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #2dd4bf 50%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      animation: wordmarkShimmer 4s ease-in-out infinite;
      background-size: 200% 200%;
    }

    @keyframes wordmarkShimmer {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .tagline {
      font-size: 14px;
      color: #9aa0a6;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .feature-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #9aa0a6;
    }

    .feature-pill.vision { border-color: rgba(66,133,244,0.35); color: #4285F4; }
    .feature-pill.image  { border-color: rgba(251,188,5,0.35);  color: #FBBC05; }
    .feature-pill.music  { border-color: rgba(52,168,83,0.35);  color: #34A853; }
    .feature-pill.video  { border-color: rgba(138,180,248,0.35); color: #8ab4f8; }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 0 0 24px;
    }

    .pin-title {
      font-size: 13px;
      font-weight: 600;
      color: #e8eaed;
      margin-bottom: 16px;
    }

    .pin-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pin-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .pin-step-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 20px;
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .pin-step-icon.puzzle {
      border-color: rgba(66,133,244,0.35);
      animation: stepPulse1 5s ease-in-out infinite;
    }

    .pin-step-icon.ext {
      font-size: 10px;
      font-weight: 700;
      color: #4285F4;
      border-color: rgba(66,133,244,0.25);
      animation: stepPulse2 5s ease-in-out infinite;
      padding: 0 6px;
    }

    .pin-step-icon.check {
      background: rgba(52,168,83,0.1);
      border-color: rgba(52,168,83,0.35);
      color: #34A853;
      font-size: 22px;
      animation: stepPulse3 5s ease-in-out infinite;
    }

    .pin-cursor {
      position: absolute;
      bottom: -4px;
      right: -2px;
      opacity: 0;
      animation: pinCursorMove 5s ease-in-out infinite;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
    }

    .pin-click-ring {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #4285F4;
      bottom: 2px;
      right: 4px;
      opacity: 0;
      animation: pinClickRing 5s ease-in-out infinite;
    }

    .pin-cursor-2 {
      position: absolute;
      bottom: -4px;
      right: 8px;
      opacity: 0;
      animation: pinCursorMove2 5s ease-in-out infinite;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
    }

    .pin-click-ring-2 {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #34A853;
      bottom: 2px;
      right: 14px;
      opacity: 0;
      animation: pinClickRing2 5s ease-in-out infinite;
    }

    .pin-arrow {
      color: rgba(255,255,255,0.2);
      font-size: 14px;
      margin-top: -14px;
    }

    .pin-arrow.a1 { animation: arrowFade1 5s ease-in-out infinite; }
    .pin-arrow.a2 { animation: arrowFade2 5s ease-in-out infinite; }

    .pin-step-label {
      font-size: 10px;
      color: #80868b;
    }

    .pin-step-label.ready {
      color: #34A853;
      font-weight: 600;
    }

    @keyframes stepPulse1 {
      0%, 5%   { box-shadow: none; }
      10%      { box-shadow: 0 0 12px rgba(66,133,244,0.4); border-color: rgba(66,133,244,0.7); }
      25%, 100%{ box-shadow: none; border-color: rgba(66,133,244,0.35); }
    }

    @keyframes stepPulse2 {
      0%, 35%  { box-shadow: none; }
      42%      { box-shadow: 0 0 12px rgba(66,133,244,0.3); border-color: rgba(66,133,244,0.6); }
      55%, 100%{ box-shadow: none; border-color: rgba(66,133,244,0.25); }
    }

    @keyframes stepPulse3 {
      0%, 65%  { box-shadow: none; transform: scale(1); }
      72%      { box-shadow: 0 0 14px rgba(52,168,83,0.4); transform: scale(1.08); border-color: rgba(52,168,83,0.7); }
      80%, 100%{ box-shadow: none; transform: scale(1); border-color: rgba(52,168,83,0.35); }
    }

    @keyframes pinCursorMove {
      0%, 4%  { opacity: 0; transform: translate(12px, 12px); }
      10%     { opacity: 1; transform: translate(0, 0); }
      18%     { opacity: 1; }
      22%     { opacity: 0; transform: translate(-8px, -4px); }
      100%    { opacity: 0; }
    }

    @keyframes pinClickRing {
      0%, 13% { opacity: 0; transform: scale(0.4); }
      15%     { opacity: 0.8; transform: scale(1); }
      20%     { opacity: 0; transform: scale(1.6); }
      100%    { opacity: 0; }
    }

    @keyframes pinCursorMove2 {
      0%, 34% { opacity: 0; transform: translate(12px, 12px); }
      40%     { opacity: 1; transform: translate(0, 0); }
      48%     { opacity: 1; }
      52%     { opacity: 0; transform: translate(-6px, -4px); }
      100%    { opacity: 0; }
    }

    @keyframes pinClickRing2 {
      0%, 44% { opacity: 0; transform: scale(0.4); }
      46%     { opacity: 0.8; transform: scale(1); }
      50%     { opacity: 0; transform: scale(1.6); }
      100%    { opacity: 0; }
    }

    @keyframes arrowFade1 {
      0%, 18% { opacity: 0.15; }
      22%     { opacity: 1; color: #4285F4; }
      30%, 100%{ opacity: 0.15; color: rgba(255,255,255,0.2); }
    }

    @keyframes arrowFade2 {
      0%, 50% { opacity: 0.15; }
      55%     { opacity: 1; color: #34A853; }
      65%, 100%{ opacity: 0.15; color: rgba(255,255,255,0.2); }
    }

    .privacy {
      font-size: 12px;
      color: #5f6368;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-wrap">
        <div class="logo-glow-bg"></div>
        <div class="logo-svg-wrap">
          <svg width="88" height="88" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Teal gradient for camera body -->
              <linearGradient id="camGrad" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2dd4bf"/>
                <stop offset="100%" stop-color="#7c3aed"/>
              </linearGradient>
              <!-- Orbit dash gradient -->
              <linearGradient id="orbitGrad" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
                <stop offset="40%" stop-color="#2dd4bf"/>
                <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="orbitGrad2" x1="88" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
                <stop offset="50%" stop-color="#6ee7b7"/>
                <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
              </linearGradient>
              <!-- Lens glass gradient -->
              <radialGradient id="lensGrad" cx="42%" cy="38%" r="58%">
                <stop offset="0%" stop-color="#7efff5" stop-opacity="0.55"/>
                <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
              </radialGradient>
              <!-- Lens shine -->
              <radialGradient id="shineGrad" cx="30%" cy="25%" r="45%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </radialGradient>
              <!-- Drop shadow filter -->
              <filter id="camGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.83  0 0 0 0 0.75  0 0 0 1 0" result="glow"/>
                <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- ── Outer orbit ring 1 (clockwise, teal sweep) ── -->
            <g class="orbit-ring">
              <circle cx="44" cy="44" r="40" stroke="url(#orbitGrad)" stroke-width="1.5"
                      stroke-dasharray="60 192" stroke-linecap="round" fill="none"/>
              <!-- dot on ring -->
              <circle cx="84" cy="44" r="3" fill="#2dd4bf" opacity="0.9"/>
            </g>

            <!-- ── Outer orbit ring 2 (counter, violet sweep) ── -->
            <g class="orbit-ring-2">
              <circle cx="44" cy="44" r="34" stroke="url(#orbitGrad2)" stroke-width="1"
                      stroke-dasharray="40 173" stroke-linecap="round" fill="none"/>
              <circle cx="44" cy="10" r="2.2" fill="#a78bfa" opacity="0.85"/>
            </g>

            <!-- ── Camera body ── -->
            <g class="cam-body" filter="url(#camGlow)">
              <!-- Body rectangle with gradient fill -->
              <rect x="18" y="30" width="52" height="36" rx="9" fill="url(#camGrad)" opacity="0.15"/>
              <rect x="18" y="30" width="52" height="36" rx="9" stroke="url(#camGrad)" stroke-width="2" fill="none"/>

              <!-- Viewfinder notch -->
              <path d="M34 30 L38 24 L50 24 L54 30 Z" fill="url(#camGrad)" opacity="0.85"/>
              <path d="M34 30 L38 24 L50 24 L54 30 Z" stroke="url(#camGrad)" stroke-width="1" fill="none"/>

              <!-- Lens ring outer -->
              <circle cx="44" cy="48" r="13" stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.6"/>
              <!-- Lens ring inner -->
              <circle cx="44" cy="48" r="9" fill="url(#lensGrad)"/>
              <!-- Lens shine highlight -->
              <circle cx="44" cy="48" r="9" fill="url(#shineGrad)" class="lens-shine"/>
              <!-- Pupil dot -->
              <circle cx="44" cy="48" r="3.5" fill="#0f172a" opacity="0.7"/>
              <circle cx="44" cy="48" r="1.5" fill="#2dd4bf" opacity="0.9"/>

              <!-- Flash LED dot -->
              <circle cx="62" cy="37" r="2.5" fill="#2dd4bf" opacity="0.7"/>
            </g>

            <!-- ── Floating star particles ── -->
            <g class="particle p1" style="--px:-14px;--py:-12px">
              <circle cx="20" cy="22" r="1.8" fill="#2dd4bf"/>
            </g>
            <g class="particle p2" style="--px:12px;--py:-10px">
              <circle cx="68" cy="18" r="1.4" fill="#a78bfa"/>
            </g>
            <g class="particle p3" style="--px:-10px;--py:10px">
              <circle cx="15" cy="65" r="1.6" fill="#6ee7b7"/>
            </g>
            <g class="particle p4" style="--px:10px;--py:8px">
              <circle cx="72" cy="68" r="1.2" fill="#2dd4bf"/>
            </g>
          </svg>
        </div>
      </div>
      <h1>AION</h1>
      <p class="tagline">Snap any screen. Instantly chat, create images,<br>compose music, and generate videos — with Google AI.</p>

      <div class="features">
        <span class="feature-pill vision">🔍 Vision</span>
        <span class="feature-pill image">✨ Image</span>
        <span class="feature-pill music">🎵 Music</span>
        <span class="feature-pill video">🎬 Video</span>
      </div>

      <hr class="divider">

      <div class="pin-title">Pin it to get started</div>
      <div class="pin-steps">
        <div class="pin-step">
          <div class="pin-step-icon puzzle">
            🧩
            <div class="pin-cursor">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M5 3l14 9-6 1.5L10 20z"/></svg>
            </div>
            <div class="pin-click-ring"></div>
          </div>
          <span class="pin-step-label">Click the puzzle icon</span>
        </div>
        <span class="pin-arrow a1">→</span>
        <div class="pin-step">
          <div class="pin-step-icon ext">
            📸 AION 📌
            <div class="pin-cursor-2">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M5 3l14 9-6 1.5L10 20z"/></svg>
            </div>
            <div class="pin-click-ring-2"></div>
          </div>
          <span class="pin-step-label">Click the pin</span>
        </div>
        <span class="pin-arrow a2">→</span>
        <div class="pin-step">
          <div class="pin-step-icon check">✓</div>
          <span class="pin-step-label ready">Ready!</span>
        </div>
      </div>
    </div>

    <p class="privacy">🔒 Your screenshots stay private</p>
  </div>
  <script src="welcome.js"></script>
</body>
</html>
