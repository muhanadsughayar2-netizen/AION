<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI - AI Chat</title>
  <script src="marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d0d0d; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%); border-bottom: 1px solid rgba(0, 217, 255, 0.3); }
    .logo { color: #fff; font-size: 20px; font-weight: 600; }
    .logo span { background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .main-content { flex: 1; display: flex; overflow: hidden; }
    .image-panel { width: 25%; min-width: 180px; max-width: 280px; background: #151515; border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; padding: 20px; }
    .image-preview { flex: 1; overflow-y: auto; border-radius: 12px; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.05); }
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #0d0d0d; }
    .chat-thread { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .chat-bubble { max-width: 85%; padding: 16px 20px; border-radius: 16px; font-size: 15px; line-height: 1.6; animation: bubbleIn 0.3s ease; }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .chat-bubble.user { align-self: flex-end; background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%); color: #000; border-bottom-right-radius: 4px; }
    .chat-bubble.ai { align-self: flex-start; background: #1a1a1a; color: #e0e0e0; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
    
    /* PREMIUM MAGIC CARD FINAL */
    .magic-card-final {
      --glow: #00d9ff;
      --rarity-glow: #fbbf24;
      background: linear-gradient(165deg, rgba(20, 20, 30, 0.95), rgba(10, 10, 15, 0.98));
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px;
      margin: 20px 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.1);
      opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .magic-card-final.show { opacity: 1; transform: translateY(0); }
    .magic-card-final::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, transparent, var(--glow), transparent); filter: blur(2px); }
    
    .sparkles { position: absolute; inset: 0; pointer-events: none; }
    .sparkle { position: absolute; width: 4px; height: 4px; background: white; border-radius: 50%; box-shadow: 0 0 10px white; animation: sparkleFloat 3s infinite linear; opacity: 0; }
    @keyframes sparkleFloat { 0% { transform: translateY(100%) scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-100%) scale(1.5); opacity: 0; } }

    .header { text-align: center; margin-bottom: 24px; }
    .emoji { font-size: 48px; margin-bottom: 12px; filter: drop-shadow(0 0 15px var(--glow)); animation: float 3s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .title { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; color: #fff; margin-bottom: 8px; }
    .badge { display: inline-block; padding: 4px 12px; background: rgba(255,255,255,0.05); border-radius: 20px; font-size: 11px; color: #888; border: 1px solid rgba(255,255,255,0.1); }

    .rarity { text-align: center; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 24px; text-shadow: 0 0 10px var(--rarity-glow); }

    .score-ring { position: relative; width: 120px; height: 120px; margin: 0 auto 32px; border-radius: 50%; background: rgba(255,255,255,0.03); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid rgba(255,255,255,0.05); }
    .ring-fill { position: absolute; inset: -4px; border-radius: 50%; transition: all 1.5s cubic-bezier(0.22, 1, 0.36, 1); }
    .score-value { font-size: 48px; font-weight: 950; letter-spacing: -2px; color: #fff; position: relative; z-index: 2; }
    .score-max { font-size: 14px; color: #666; margin-top: -4px; position: relative; z-index: 2; }

    .highlight { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; margin-bottom: 24px; font-size: 15px; line-height: 1.5; color: #cbd5e1; }
    .highlight strong { color: var(--glow); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; display: block; margin-bottom: 4px; }

    .section { margin-bottom: 24px; padding: 20px; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); }
    .label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #64748b; margin-bottom: 16px; display: block; }
    .list { list-style: none; }
    .item { position: relative; padding-left: 24px; margin-bottom: 12px; font-size: 14px; color: #e2e8f0; line-height: 1.5; }
    .item::before { content: ''; position: absolute; left: 0; top: 8px; width: 12px; height: 2px; background: var(--glow); opacity: 0.5; }
    .item.high { color: #f87171; font-weight: 600; }
    .item.high::before { background: #f87171; opacity: 1; box-shadow: 0 0 8px #f87171; }

    .actions { margin-bottom: 24px; }
    .action-grid { display: grid; gap: 12px; }
    .action { display: flex; gap: 16px; align-items: center; padding: 16px; background: rgba(59, 130, 246, 0.05); border: 1px solid rgba(59, 130, 246, 0.1); border-radius: 16px; }
    .num { width: 28px; height: 28px; background: linear-gradient(135deg, #3b82f6, #7c3aed); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0; }
    .action-text { font-size: 14px; font-weight: 500; color: #fff; }

    .verdict { background: linear-gradient(135deg, #2563eb, #7c3aed); border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 15px 30px rgba(37, 99, 235, 0.3); }
    .verdict .label { color: rgba(255,255,255,0.6); margin-bottom: 8px; }
    .verdict .text { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.4; margin-bottom: 16px; }
    .risk { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; background: rgba(0,0,0,0.2); }
    .risk.high { background: #f87171; color: #fff; }
    .risk.medium { background: #fbbf24; color: #000; }
    .risk.low { background: #4ade80; color: #000; }

    .next { text-align: center; font-size: 13px; font-weight: 600; color: #64748b; font-style: italic; margin-bottom: 24px; }

    .progress { margin-bottom: 24px; }
    .bar { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
    .fill { height: 100%; background: linear-gradient(90deg, var(--glow), #7c3aed); transition: width 1s ease-out; }
    .stats { font-size: 11px; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 1px; text-align: center; }

    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn { padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--glow); transform: translateY(-2px); }

    .input-area { padding: 24px; background: #0d0d0d; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 12px; }
    .chat-input { flex: 1; padding: 16px 20px; background: #1a1a1a; border: 1px solid rgba(0, 217, 255, 0.3); border-radius: 16px; color: #fff; font-size: 15px; outline: none; resize: none; min-height: 56px; max-height: 150px; }
    .send-btn { padding: 0 28px; background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%); border: none; border-radius: 16px; color: #000; font-weight: 700; cursor: pointer; }
    
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 10000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Snap<span>ToAI</span> 📸</div>
    <button class="close-btn" onclick="window.close()">✕</button>
  </div>

  <div class="main-content">
    <div class="image-panel">
      <div class="image-label">Analyzing Image</div>
      <div class="image-preview" id="imagePreview">
        <img id="previewImage" src="" alt="">
      </div>
      <div class="magic-buttons" id="magicButtons"></div>
    </div>

    <div class="chat-panel">
      <div class="chat-thread" id="chatThread">
        <div class="welcome-message">
          <h2>Ready for Magic? ✨</h2>
          <p>Click a Magic Button above or ask anything below.</p>
        </div>
      </div>

      <div class="input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Ask about your screenshot..."></textarea>
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="ai-chat.js"></script>
</body>
</html>
