<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI - AI Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #131314;
      color: #e3e3e3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #1e1f20;
      border-bottom: 1px solid #3c4043;
    }
    
    .logo {
      font-size: 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo span { color: #8ab4f8; }
    
    .close-btn {
      background: none;
      border: none;
      color: #9aa0a6;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    
    .close-btn:hover { background: rgba(255,255,255,0.1); }
    
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    
    .image-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #2d2e30;
      padding: 8px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .image-chip:hover { background: #3c4043; }
    
    .image-chip img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }
    
    .image-chip span {
      font-size: 13px;
      color: #9aa0a6;
    }
    
    .image-preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .image-preview-modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }
    
    .message-container {
      margin-bottom: 24px;
    }
    
    .message-container.user {
      display: flex;
      justify-content: flex-end;
    }
    
    .user-bubble {
      background: #004a77;
      color: #e3e3e3;
      padding: 12px 16px;
      border-radius: 20px;
      max-width: 80%;
      font-size: 15px;
      line-height: 1.5;
    }
    
    .ai-message {
      display: flex;
      gap: 12px;
    }
    
    .ai-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .ai-icon svg {
      width: 16px;
      height: 16px;
      fill: white;
    }
    
    .ai-content {
      flex: 1;
      min-width: 0;
    }
    
    .ai-content p { margin: 0 0 12px 0; line-height: 1.7; font-size: 15px; }
    .ai-content p:last-child { margin-bottom: 0; }
    .ai-content strong { color: #8ab4f8; font-weight: 600; }
    .ai-content ul, .ai-content ol { margin: 12px 0; padding-left: 24px; }
    .ai-content li { margin: 8px 0; line-height: 1.6; }
    .ai-content li strong { color: #8ab4f8; }
    
    .ai-content code {
      background: #2d2e30;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
    }
    
    .ai-content pre {
      background: #1e1f20;
      border: 1px solid #3c4043;
      border-radius: 12px;
      padding: 16px;
      margin: 12px 0;
      overflow-x: auto;
      position: relative;
    }
    
    .ai-content pre code {
      background: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.5;
    }
    
    .message-actions {
      display: flex;
      gap: 4px;
      margin-top: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .message-container:hover .message-actions { opacity: 1; }
    
    .action-btn {
      background: none;
      border: none;
      color: #9aa0a6;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .action-btn:hover { background: rgba(255,255,255,0.1); }
    
    .action-btn svg { width: 18px; height: 18px; }
    
    .thinking {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .thinking-star {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570, #00d9ff);
      mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>');
      -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>');
      animation: spin 2s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .thinking span { color: #9aa0a6; font-size: 14px; }
    
    .input-section {
      padding: 16px 24px 24px;
      background: #131314;
    }
    
    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e1f20;
      border: 1px solid #3c4043;
      border-radius: 28px;
      padding: 8px 8px 8px 20px;
      transition: border-color 0.2s;
    }
    
    .input-box:focus-within { border-color: #8ab4f8; }
    
    .input-box input {
      flex: 1;
      background: none;
      border: none;
      color: #e3e3e3;
      font-size: 15px;
      outline: none;
    }
    
    .input-box input::placeholder { color: #9aa0a6; }
    
    .send-btn {
      background: #8ab4f8;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    
    .send-btn:hover { background: #aecbfa; }
    .send-btn:disabled { background: #3c4043; cursor: not-allowed; }
    .send-btn svg { width: 20px; height: 20px; fill: #131314; }
    
    .footer-btns {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    
    .footer-btn {
      background: #2d2e30;
      border: 1px solid #3c4043;
      color: #9aa0a6;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    
    .footer-btn:hover { background: #3c4043; color: #e3e3e3; }
    
    .footer-btn svg { width: 16px; height: 16px; fill: currentColor; }
    
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #3c4043;
      color: #e3e3e3;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Gemini 3 <span>Flash</span></div>
    <button class="close-btn" onclick="window.close()">&#10005;</button>
  </div>
  
  <div class="chat-area" id="chatArea">
    <div class="image-chip" id="imageChip" onclick="showImageModal()">
      <img id="chipImage" src="" alt="Screenshot">
      <span>Analyzing image</span>
    </div>
    
    <div id="chatThread"></div>
    
    <div class="thinking" id="thinking">
      <div class="thinking-star"></div>
      <span>Thinking...</span>
    </div>
  </div>
  
  <div class="image-preview-modal" id="imageModal" onclick="hideImageModal()">
    <img id="modalImage" src="" alt="Full preview">
  </div>
  
  <div class="input-section">
    <div class="input-wrapper">
      <div class="input-box">
        <input type="text" id="chatInput" placeholder="Ask about your screenshot..." onkeypress="if(event.key==='Enter')handleSend()">
        <button class="send-btn" id="sendBtn" onclick="handleSend()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="footer-btns">
        <button class="footer-btn" id="testBtn" onclick="testApi()">
          <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          Test API
        </button>
        <button class="footer-btn" onclick="clearChat()">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          Clear
        </button>
        <button class="footer-btn" onclick="copyChat()">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          Copy
        </button>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast">Copied to clipboard!</div>
  
  <script src="ai-chat.js"></script>
</body>
</html>
