<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI - AI Chat</title>
  <script src="marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
      border-bottom: 1px solid rgba(0, 217, 255, 0.3);
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
    }
    
    .logo span {
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #888;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .image-panel {
      width: 25%;
      min-width: 180px;
      max-width: 280px;
      background: #151515;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    
    .image-label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    
    .image-preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    
    .multi-image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      padding: 12px;
      width: 100%;
      max-height: 100%;
      overflow-y: auto;
    }
    
    .multi-image-grid .grid-image {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    
    .multi-image-grid .grid-image:hover {
      border-color: #00d9ff;
      transform: scale(1.05);
    }
    
    .multi-image-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: linear-gradient(135deg, #00d9ff, #00b8d4);
      color: #000;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .image-preview {
      position: relative;
    }
    
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
    }
    
    .chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .welcome-message {
      text-align: center;
      color: #888;
      font-size: 16px;
      padding: 40px 20px;
    }
    
    .chat-bubble {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      animation: bubbleIn 0.3s ease;
    }
    
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .chat-bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      color: #000;
      border-bottom-right-radius: 4px;
    }
    
    .chat-bubble.ai {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    
    .chat-bubble.ai strong { color: #00d9ff; }
    .chat-bubble.ai ul, .chat-bubble.ai ol { margin: 8px 0; padding-left: 20px; }
    .chat-bubble.ai li { margin: 4px 0; }
    .chat-bubble.ai code { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .chat-bubble.ai pre { background: #1a1a1a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .chat-bubble.ai p { margin: 8px 0; }
    .chat-bubble.ai p:first-child { margin-top: 0; }
    .chat-bubble.ai p:last-child { margin-bottom: 0; }
    
    .chat-bubble.loading {
      background: #2a2a2a;
      color: #00d9ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .star {
      width: 18px;
      height: 18px;
      background: linear-gradient(45deg, #4285f4, #9b72cb, #d96570, #00d9ff);
      mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>');
      -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>');
      animation: spin 2s infinite linear;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .chat-bubble.error {
      background: rgba(255, 82, 82, 0.2);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
    }
    
    .input-area {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      background: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .chat-input {
      flex: 1;
      padding: 16px 20px;
      background: #1a1a1a;
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      min-height: 52px;
      max-height: 150px;
      overflow-y: auto;
      line-height: 1.4;
    }
    
    .chat-input:focus {
      border-color: #00d9ff;
    }
    
    .chat-input::placeholder {
      color: #555;
    }
    
    .send-btn {
      padding: 16px 28px;
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0, 217, 255, 0.3);
    }
    
    .send-btn:hover {
      background: linear-gradient(135deg, #00e8ff 0%, #00d9ff 100%);
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.5);
      transform: translateY(-1px);
    }
    
    .send-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    
    .footer-actions {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      background: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .action-btn {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    
    .test-btn {
      background: rgba(0, 217, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.3);
      color: #00d9ff;
    }
    
    .test-btn:hover {
      background: rgba(0, 217, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">Gemini 3 <span>Flash</span></div>
    </div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  
  <div class="main-content">
    <div class="image-panel">
      <div class="image-label">Analyzing Image</div>
      <div class="image-preview">
        <img id="previewImage" src="" alt="Screenshot">
      </div>
    </div>
    
    <div class="chat-panel">
      <div class="chat-thread" id="chatThread">
        <div class="welcome-message">I'm your AI partner. Ask me anything about this image!</div>
      </div>
      
      <div class="input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Ask about your screenshot..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
      
      <div class="footer-actions">
        <button class="action-btn test-btn" id="testBtn">🔌 Test API</button>
        <button class="action-btn" id="clearBtn">Clear Chat</button>
        <button class="action-btn" id="copyBtn">Copy Chat</button>
      </div>
    </div>
  </div>
  
  <script src="ai-chat.js"></script>
</body>
</html>
