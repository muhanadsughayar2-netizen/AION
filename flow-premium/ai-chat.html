<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI - AI Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
      border-bottom: 1px solid rgba(0, 217, 255, 0.3);
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
    }
    
    .logo span {
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #888;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .image-panel {
      width: 40%;
      min-width: 200px;
      max-width: 400px;
      background: #151515;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    
    .image-label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    
    .image-preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
    }
    
    .chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .welcome-message {
      text-align: center;
      color: #888;
      font-size: 16px;
      padding: 40px 20px;
    }
    
    .chat-bubble {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      animation: bubbleIn 0.3s ease;
    }
    
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .chat-bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      color: #000;
      border-bottom-right-radius: 4px;
    }
    
    .chat-bubble.ai {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    
    .chat-bubble.loading {
      background: #2a2a2a;
      color: #00d9ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .star {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #00d9ff, #00b8d4);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: spin 1.5s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .chat-bubble.error {
      background: rgba(255, 82, 82, 0.2);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
    }
    
    .input-area {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      background: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .chat-input {
      flex: 1;
      padding: 16px 20px;
      background: #1a1a1a;
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .chat-input:focus {
      border-color: #00d9ff;
    }
    
    .chat-input::placeholder {
      color: #555;
    }
    
    .send-btn {
      padding: 16px 28px;
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0, 217, 255, 0.3);
    }
    
    .send-btn:hover {
      background: linear-gradient(135deg, #00e8ff 0%, #00d9ff 100%);
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.5);
      transform: translateY(-1px);
    }
    
    .send-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    
    .footer-actions {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      background: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .action-btn {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    
    .test-btn {
      background: rgba(0, 217, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.3);
      color: #00d9ff;
    }
    
    .test-btn:hover {
      background: rgba(0, 217, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">Gemini 3 <span>Flash</span></div>
    </div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  
  <div class="main-content">
    <div class="image-panel">
      <div class="image-label">Analyzing Image</div>
      <div class="image-preview">
        <img id="previewImage" src="" alt="Screenshot">
      </div>
    </div>
    
    <div class="chat-panel">
      <div class="chat-thread" id="chatThread">
        <div class="welcome-message">I'm your AI partner. Ask me anything about this image!</div>
      </div>
      
      <div class="input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ask about your screenshot...">
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
      
      <div class="footer-actions">
        <button class="action-btn test-btn" id="testBtn">🔌 Test API</button>
        <button class="action-btn" id="clearBtn">Clear Chat</button>
        <button class="action-btn" id="copyBtn">Copy Chat</button>
      </div>
    </div>
  </div>
  
  <script src="ai-chat.js"></script>
</body>
</html>
