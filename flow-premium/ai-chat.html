<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapToAI - AI Chat</title>
  <script src="marked.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
      border-bottom: 1px solid rgba(0, 217, 255, 0.3);
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
    }
    
    .logo span {
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #888;
      font-size: 20px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .image-panel {
      width: 25%;
      min-width: 180px;
      max-width: 280px;
      background: #151515;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    
    .image-label {
      color: #888;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    
    .image-preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .image-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
    }
    
    .chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .welcome-message {
      text-align: center;
      color: #888;
      font-size: 16px;
      padding: 40px 20px;
    }
    
    .chat-bubble {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      animation: bubbleIn 0.3s ease;
    }
    
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .chat-bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      color: #000;
      border-bottom-right-radius: 4px;
    }
    
    .chat-bubble.ai {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    
    .chat-bubble.ai strong { color: #00d9ff; }
    .chat-bubble.ai ul, .chat-bubble.ai ol { margin: 8px 0; padding-left: 20px; }
    .chat-bubble.ai li { margin: 4px 0; }
    .chat-bubble.ai code { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .chat-bubble.ai pre { background: #1a1a1a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .chat-bubble.ai p { margin: 8px 0; }
    .chat-bubble.ai p:first-child { margin-top: 0; }
    .chat-bubble.ai p:last-child { margin-bottom: 0; }
    
    .chat-bubble.loading {
      background: #2a2a2a;
      color: #00d9ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .star {
      width: 18px;
      height: 18px;
      background: linear-gradient(45deg, #4285f4, #9b72cb, #d96570, #00d9ff);
      mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>');
      -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>');
      animation: spin 2s infinite linear;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .chat-bubble.error {
      background: rgba(255, 193, 7, 0.15);
      color: #ffc107;
      border: 1px solid rgba(255, 193, 7, 0.3);
    }
    
    .input-area {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      background: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .chat-input {
      flex: 1;
      padding: 16px 20px;
      background: #1a1a1a;
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .chat-input:focus {
      border-color: #00d9ff;
    }
    
    .chat-input::placeholder {
      color: #555;
    }
    
    .send-btn {
      padding: 16px 28px;
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0, 217, 255, 0.3);
    }
    
    .send-btn:hover {
      background: linear-gradient(135deg, #00e8ff 0%, #00d9ff 100%);
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.5);
      transform: translateY(-1px);
    }
    
    .send-btn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    
    .footer-actions {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      background: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .action-btn {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    
    .test-btn {
      background: rgba(0, 217, 255, 0.1);
      border-color: rgba(0, 217, 255, 0.3);
      color: #00d9ff;
    }
    
    .test-btn:hover {
      background: rgba(0, 217, 255, 0.2);
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tutor-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 20px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
    }
    
    .tutor-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      transition: 0.3s;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #888;
      transition: 0.3s;
    }
    
    .slider.round {
      border-radius: 20px;
    }
    
    .slider.round:before {
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background: linear-gradient(135deg, #9b72cb 0%, #d96570 100%);
    }
    
    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #fff;
    }
    
    .voice-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      font-size: 18px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .voice-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    
    .voice-btn.speaking {
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .flashcard-wrapper {
      width: 100%;
      padding: 10px 0;
    }
    
    .flashcard-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .flashcard-container {
      background: transparent;
      width: 100%;
      height: 120px;
      perspective: 1000px;
      cursor: pointer;
    }
    
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.2);
    }
    
    .flashcard-container.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }
    
    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
    }
    
    .flashcard-front {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 600;
    }
    
    .flashcard-back {
      background: linear-gradient(135deg, #00d9ff 0%, #00b8d4 100%);
      color: #000;
      transform: rotateY(180deg);
    }
    
    .save-pdf-btn {
      background: rgba(0, 217, 255, 0.1);
      border: 1px solid rgba(0, 217, 255, 0.3);
      color: #00d9ff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      font-size: 13px;
      transition: all 0.2s;
    }
    
    .save-pdf-btn:hover {
      background: rgba(0, 217, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">Gemini 3 <span>Flash</span></div>
      <div class="tutor-control">
        <span class="tutor-label">Tutor</span>
        <label class="switch">
          <input type="checkbox" id="tutorToggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
    <div class="header-right">
      <button class="voice-btn" id="voiceBtn" title="Read response aloud">🔊</button>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
  </div>
  
  <div class="main-content">
    <div class="image-panel">
      <div class="image-label">Analyzing Image</div>
      <div class="image-preview">
        <img id="previewImage" src="" alt="Screenshot">
      </div>
    </div>
    
    <div class="chat-panel">
      <div class="chat-thread" id="chatThread">
        <div class="welcome-message">I'm your AI partner. Ask me anything about this image!</div>
      </div>
      
      <div class="input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ask about your screenshot...">
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
      
      <div class="footer-actions">
        <button class="action-btn test-btn" id="testBtn">🔌 Test API</button>
        <button class="action-btn" id="flashcardBtn">⚡ Flashcards</button>
        <button class="action-btn" id="clearBtn">Clear Chat</button>
        <button class="action-btn" id="copyBtn">Copy Chat</button>
      </div>
    </div>
  </div>
  
  <script src="ai-chat.js"></script>
</body>
</html>
